  function renderDirtyTricks(player, data, gaCol) {
    const used = data.used || [];
    const resetUsed = data.resetUsed || false;
    const value = data.value || 0;
    let html = '<div class="ft-row"><span class="ft-label">Used</span><span class="ft-val" id="ft-val-' + player + '" style="width:24px;height:20px;font-size:11px;color:' + gaCol + '">' + value + '</span><span style="font-size:8px;color:var(--dim)">this round</span>';
    html += '<button class="ft-btn" id="ft-reset-' + player + '" onclick="Actions.resetFTDirtyTricks(\'' + player + '\')" ' + (resetUsed ? 'disabled style="opacity:0.4;"' : '') + ' style="font-size:9px;padding:0 8px;min-width:auto;height:20px;margin-left:4px;">End Turn</button>';
    html += '</div><div class="ft-row" style="flex-wrap:wrap;gap:3px;padding-top:2px">';
    CONFIG.DIRTY_TRICKS_LIST.forEach((trick, i) => {
      const isUsed = used.indexOf(i) > -1;
      html += '<span class="ft-check ' + (isUsed ? 'used' : '') + '" onclick="Actions.toggleFTDirtyTrick(\'' + player + '\',' + i + ')" id="ft-dt-' + player + '-' + i + '"><span class="ft-dot"></span> ' + esc(trick) + '</span>';
    });
    html += '</div>';
    return html;
  }

  function renderDelusions(player, data, gaCol) {
    const val = data.value || 0;
    const prev = data.previous !== undefined ? data.previous : 0;
    let html = '<div class="ft-row"><span class="ft-label">Active</span><select id="ft-del-' + player + '" class="tac-select" style="flex:1;min-width:60px;padding:2px 4px;font-size:10px;height:22px" onchange="Actions.setFTDelusion(\'' + player + '\',this.value)">';
    CONFIG.DELUSIONS_LIST.forEach((d, i) => { html += '<option value="' + i + '" ' + (i === val ? 'selected' : '') + '>' + esc(d) + '</option>'; });
    html += '</select></div><div class="ft-row"><span class="ft-label">Prev</span><span style="font-size:10px;color:var(--parchDim)">' + (CONFIG.DELUSIONS_LIST[prev] || 'None') + '</span></div>';
    return html;
  }

  function renderSylvaneth(player, data, tracker, gaCol) {
    const val = data.value || 0;
    const max = tracker.max || 12;
    return '<div class="ft-row"><span class="ft-label" style="color:' + gaCol + '"></span><div class="game-track-stepper"><div class="game-track-btn" onclick="Actions.adjFTStepper(\'' + player + '\',-1,0,' + max + ')">−</div><div class="game-track-val" id="ft-val-' + player + '" style="color:' + gaCol + ';width:28px;height:22px;font-size:12px">' + val + '</div><div class="game-track-btn" onclick="Actions.adjFTStepper(\'' + player + '\',1,0,' + max + ')">+</div></div><span style="font-size:8px;color:var(--dim);margin-left:3px">/' + max + '</span></div><div class="ft-row"><span class="ft-label">Creeping Overgrowth</span><span style="font-size:10px;color:var(--parchDim);" id="ft-range-' + player + '">' + getSylvanethRange(val) + '</span></div>';
  }

  function renderLumineth(player, data, gaCol) {
    const state = S.battle.lumineth[player];
    const scripture = state.scripture || { strength:0, river:0, wind:0, mountain:0 };
    const active = data && data.active ? data.active : null;
    const runeKeys = ['strength', 'river', 'wind', 'mountain'];
    const uniqueCount = runeKeys.filter(k => scripture[k] > 0).length;
    const zenithActive = uniqueCount >= 4;
    const isRound1 = S.battle.currentRound === 0;
    const extraRune = state.extraRune || false;
    const extraUsed = state.extraUsed || false;
    const alreadyPicked = active !== null;
    const allowSecondPick = isRound1 && extraRune && !extraUsed && alreadyPicked;
    const disabled = (alreadyPicked && !allowSecondPick) || (isRound1 && extraUsed);
    let html = '<div class="ft-row" style="flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0;">';
    runeKeys.forEach(key => {
      const name = RUNE_DATA[key].name.split('–')[0].trim();
      const onclick = disabled ? '' : 'onclick="Actions.pickLuminethRune(\'' + player + '\',\'' + key + '\')"';
      html += '<button class="ft-btn" style="font-size:11px;padding:6px 16px;' + (disabled ? 'opacity:0.4;' : '') + '" ' + onclick + '>' + name + '</button>';
    });
    html += '</div>';
    if (isRound1) {
      const checked = extraRune ? 'checked' : '';
      const disabledAttr = extraUsed ? 'disabled' : '';
      html += '<div class="ft-row" style="justify-content:center;padding:4px 0;"><label style="font-size:10px;color:var(--parch);display:flex;align-items:center;gap:6px;"><input type="checkbox" ' + checked + ' ' + disabledAttr + ' onchange="S.battle.lumineth.' + player + '.extraRune=this.checked;saveDraftDebounced();render(true);"> Extra Rune (round 1)</label>' + (extraUsed ? '<span style="font-size:9px;color:var(--gold);margin-left:6px;">✓ used</span>' : '') + '</div>';
    }
    html += '<div class="ft-row" style="justify-content:center;gap:12px;font-size:10px;color:var(--parchDim);padding:4px 0;">' + runeKeys.map(key => RUNE_DATA[key].name.split('–')[0].trim() + ': ' + (scripture[key] || 0)).join(' | ') + '</div>';
    if (active) {
      const rune = RUNE_DATA[active];
      html += '<div style="margin:4px 0;font-size:11px;color:var(--gold);"><strong>Active: ' + rune.name + '</strong><br><span style="color:var(--parch);">Base: ' + rune.base + '</span></div>';
      const enhanced = [];
      Object.entries(rune.enhanced).forEach(([otherKey, desc]) => {
        if (scripture[otherKey] > 0) enhanced.push('<span style="color:var(--destr);">+ (' + RUNE_DATA[otherKey].name.split('–')[0].trim() + '): ' + desc + '</span>');
      });
      if (enhanced.length) html += '<div style="font-size:10px;padding-left:8px;">' + enhanced.join('<br>') + '</div>';
    } else {
      html += '<div style="font-size:10px;color:var(--dim);font-style:italic;">No rune depicted this round.</div>';
    }
    if (zenithActive) html += '<div style="margin-top:4px;font-size:10px;color:var(--gold);border-top:1px solid var(--bdr);padding-top:4px;">✨ Zenith Active: +4" Move & Crit on 5+ for all Lumineth.</div>';
    return html;
  }

  function renderTides(player, data, gaCol) {
    const state = S.battle.tideState[player];
    const currentTrack = state.track;
    const currentStep = state.step;
    const activeTrack = data.track || null;
    const activeStep = data.step || 0;
    const isSelected = activeTrack !== null;
    const tracks = {
      storm: { label: 'Storm', steps: ['Unpredictable Tide', 'Inexorable Tide', "Storm's Wrath"], descs: ['Teleport a unit not in combat', '−1 Rend against IDONETH DEEPKIN units', 'Melee weapons have Crit (Mortal)'] },
      sea: { label: 'Sea', steps: ['Concealing Tide', 'Swift Tide', "Sea's Embrace"], descs: ['−1 hit for units that didn\'t CHARGE', 'Run and still Shoot/Charge', 'Strike-First'] }
    };
    let html = '<div style="display:flex; gap:12px; justify-content:center;">';
    for (const [trackKey, trackData] of Object.entries(tracks)) {
      html += '<div style="flex:1; text-align:center;">';
      html += '<div style="font-size:10px; color:var(--parchDim); text-transform:uppercase; margin-bottom:4px;">' + trackData.label + '</div>';
      trackData.steps.forEach((name, idx) => {
        const stepNum = idx + 1;
        let selectable = false;
        let isActiveOption = (activeTrack === trackKey && activeStep === stepNum);
        if (isSelected) { if (isActiveOption) selectable = true; }
        else {
          if (currentTrack === null) { if (stepNum === 1) selectable = true; }
          else if (currentTrack === trackKey) { if (stepNum === currentStep + 1) selectable = true; if (stepNum === 1 && currentStep > 1) selectable = true; }
          else { if (stepNum === 1) selectable = true; }
        }
        const isActive = isActiveOption;
        const isPassed = (currentTrack === trackKey && currentStep > stepNum);
        const isOtherTrackBlocked = (currentTrack !== null && currentTrack !== trackKey && stepNum !== 1);
        let style = 'padding:4px 8px; margin:4px 0; border-radius:4px; font-size:11px; ';
        if (isActive) style += 'background:var(--goldDim); border:2px solid var(--gold); color:var(--gold); font-weight:bold; cursor:pointer;';
        else if (isSelected && !isActive) style += 'background:var(--bg3); border:1px solid var(--bdr); color:var(--dim); opacity:0.3; cursor:not-allowed;';
        else if (isPassed || isOtherTrackBlocked) style += 'background:var(--bg3); border:1px solid var(--bdr); color:var(--dim); opacity:0.4; cursor:not-allowed;';
        else if (selectable) { style += 'background:var(--bg3); border:1px solid var(--bdr); color:var(--parch); cursor:pointer; transition:all .15s;'; style += ' onmouseover="this.style.background=\'var(--goldDim)\'; this.style.borderColor=\'var(--gold)\';"'; style += ' onmouseout="this.style.background=\'var(--bg3)\'; this.style.borderColor=\'var(--bdr)\';"'; }
        else style += 'background:var(--bg3); border:1px solid var(--bdr); color:var(--dim); opacity:0.4; cursor:not-allowed;';
        let onclick = '';
        if (isActive && isSelected) onclick = 'onclick="Actions.clearFTTide(\'' + player + '\')"';
        else if (selectable && !isActive) onclick = 'onclick="Actions.setFTTide(\'' + player + '\',\'' + trackKey + '\',' + stepNum + ')"';
        const desc = isActive ? trackData.descs[idx] : '';
        html += '<div style="' + style + '" ' + onclick + '>' + name + (desc ? '<br><span style="font-size:8px;color:var(--parchDim);">' + desc + '</span>' : '') + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderKhorne(player, gaCol) {
    const state = S.battle.khorne[player];
    let html = '<div class="khorne-tree">';
    html += '<div class="ft-row" style="margin-bottom:6px;"><span class="ft-label" style="color:' + gaCol + ';min-width:60px;">Blood Tithe</span><div class="game-track-stepper"><div class="game-track-btn" onclick="Actions.adjKhornePoints(\'' + player + '\',-1)">−</div><div class="game-track-val" style="width:40px;color:' + gaCol + ';">' + state.points + '</div><div class="game-track-btn" onclick="Actions.adjKhornePoints(\'' + player + '\',1)">+</div></div></div>';
    KHORNE_ORDER.forEach(id => {
      const ability = KHORNE_TREE[id];
      const isUnlocked = state.unlocked.includes(id);
      const hasParent = ability.parents.length === 0 || ability.parents.some(p => state.unlocked.includes(p));
      const canAfford = state.points >= ability.cost;
      const isAvailable = !isUnlocked && hasParent && canAfford;
      let cls = 'khorne-ability';
      let statusText = '';
      if (isUnlocked) { cls += ' unlocked'; statusText = '✓'; }
      else if (isAvailable) { cls += ' available'; statusText = 'Cost: ' + ability.cost; }
      else { cls += ' locked'; if (!hasParent && ability.parents.length > 0) statusText = 'Prereq missing'; else if (!canAfford) statusText = 'Need ' + (ability.cost - state.points) + ' more'; }
      const onclick = isAvailable ? 'onclick="Actions.unlockKhorneAbility(\'' + player + '\',\'' + id + '\')"' : '';
      html += '<div class="' + cls + '" ' + onclick + '>' + ability.name + ' <span class="khorne-status">' + statusText + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderFactionTracker(player, faction, useTrackers) {
    if (!useTrackers) return null;
    const tracker = getTracker(faction);
    if (!tracker) return null;
    const p = player === 'p1' ? 'p1ft' : 'p2ft';
    const rd = S.battle.rounds[S.battle.currentRound];
    let data = rd[p] || { active: null };
    if (typeof data !== 'object' || data === null) data = { value: data, active: null };
    const gaCol = getGAColorForFaction(faction);
    let html = '<div class="faction-tracker-block" style="border-color:' + gaCol + '44; background:' + gaCol + '08">';
    html += '<div class="tracker-label" style="color:' + gaCol + '">' + esc(tracker.label) + '</div>';
    switch (tracker.type) {
      case 'rdp': html += renderRDP(player, data, tracker, gaCol); break;
      case 'badmoon': html += renderBadMoon(player, data, gaCol); break;
      case 'dirtytricks': html += renderDirtyTricks(player, data, gaCol); break;
      case 'delusions': html += renderDelusions(player, data, gaCol); break;
      case 'sylvaneth': html += renderSylvaneth(player, data, tracker, gaCol); break;
      case 'lumineth': html += renderLumineth(player, data, gaCol); break;
      case 'tides': html += renderTides(player, data, gaCol); break;
      case 'khorne': html += renderKhorne(player, gaCol); break;
      case 'dok_simple': html += renderDOKSimple(player, gaCol); break;
      default: html += '<div class="ft-none">Unknown tracker type</div>';
    }
    html += '</div>';
    return html;
  }

  function renderLogGame() {
    if (S.battle.step === 0) return renderLogSetup();
    if (S.battle.step === 1) return renderLogScore();
    return renderLogConfirm();
  }

  function renderLogSetup() {
    if (S.auth.session) {
      const f = DataCache.user(S.auth.session.username);
      if (f) { S.auth.session = f; S.profile.name = f.displayName || f.username; S.profile.factions = [...f.factions]; }
    }
    const users = DataCache.users;
    const others = Object.values(users).filter(u => u.username !== S.auth.session.username && !u.isSuspended && u.username !== CONFIG.SPECIAL_USERS.ADMIN);
    const scenarioDropdown = UI.scenarioDropdown('battle.scenario', S.battle.scenario);
    let oppSheet = '';
    if (S.battle.opponentSheetOpen) {
      let oi = '';
      oi += '<div class="sh-item" onclick="Actions.selectOpponent(\'__ancient__\',\'The Ancient Enemy\',\'[]\')">' + ic('shield', 16) + '<div><div style="font-weight:bold">The Ancient Enemy</div><div style="font-size:12px;color:var(--dim)">Practice / Solo</div></div></div>';
      if (S.battle.guestOpen) {
        oi += '<div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px" onclick="event.stopPropagation()"><label class="lbl">Guest Player Name</label>' + UI.textInput('battle.guestInput', { placeholder: "e.g. Dave's mate", value: S.battle.guestInput }) + '<div class="btn-row"><button class="btn btn-o btn-sm" onclick="Actions.cancelGuestInput()">Cancel</button><button class="btn btn-g btn-sm" onclick="Actions.confirmGuest()">Confirm</button></div></div>';
      } else {
        oi += '<div class="sh-item" onclick="Actions.openGuestInput()">' + ic('user', 16) + '<div><div style="font-weight:bold">Guest Player</div><div style="font-size:12px;color:var(--dim)">Enter name</div></div></div>';
      }
      others.forEach(u => {
        const col = gaColor(gaFor(u.factions[0] || ''));
        oi += '<div class="sh-item" data-opp-username="' + esc(u.username) + '" data-opp-display="' + esc(u.displayName || u.username) + '" data-opp-factions="' + esc(JSON.stringify(u.factions).replace(/"/g,'&quot;')) + '" onclick="Actions.selectOpponent(this.dataset.oppUsername,this.dataset.oppDisplay,this.dataset.oppFactions)">' + ic('user', 16, col) + '<div><div style="font-weight:bold">' + esc(u.displayName || u.username) + '</div><div style="font-size:12px;color:var(--dim)">' + esc(u.factions.slice(0,2).join(', ') || 'No faction') + '</div></div></div>';
      });
      oppSheet = '<div class="overlay" onclick="Actions.closeOpponentSheet()"><div class="sheet" onclick="event.stopPropagation()"><div class="sh-handle"></div><div class="sh-head">Select Opponent</div><div class="sh-body">' + oi + '</div></div></div>';
    }
    const p1L = esc(S.auth.session.username);
    const p2L = esc(S.battle.opponent?.displayName || 'Opponent');
    return UI.sectionHeader('Log Battle', 'Set up your engagement') +
      '<div class="user-banner">⚔️ ' + p1L + ' ⚔️</div>' +
      '<div class="user-banner-sub">Commander of ' + esc(S.battle.faction1 || 'an unsworn host') + '</div>' +
      '<div style="padding:0 16px; padding-bottom:40px;">' +
      (S.battle.setupError ? '<div class="err-msg">' + ic('alert', 16, 'var(--red)') + ' ' + esc(S.battle.setupError) + '</div>' : '') +
      UI.formField('Your Faction', '<button class="btn btn-o" id="faction-btn-f1" onclick="Actions.openFactionPicker(\'f1\')">' + esc(S.battle.faction1 || 'Select faction…') + '</button>') +
      UI.formField('Opponent', '<button class="btn btn-o" onclick="Actions.openOpponentSheet()">' + esc(S.battle.opponent ? S.battle.opponent.displayName : 'Select opponent…') + '</button>') +
      (S.battle.opponent ? UI.formField("Opponent's Faction", '<button class="btn btn-o" id="faction-btn-f2" onclick="Actions.openFactionPicker(\'f2\')">' + esc(S.battle.faction2 || 'Select faction…') + '</button>') : '') +
      UI.formField(p1L + ' Battle Tactics', '<div style="display:flex;flex-direction:column;gap:8px">' + renderTacticSelect('p1', 0, false) + renderTacticSelect('p1', 1, false) + '</div>') +
      (S.battle.opponent ? UI.formField(p2L + ' Battle Tactics', '<div style="display:flex;flex-direction:column;gap:8px">' + renderTacticSelect('p2', 0, false) + renderTacticSelect('p2', 1, false) + '</div>') : '') +
      UI.formField('Battle Plan / Scenario', scenarioDropdown) +
      '<div class="check-row"><label><input type="checkbox" ' + (S.battle.useFactionTrackers ? 'checked' : '') + ' onchange="S.battle.useFactionTrackers=this.checked;saveDraftDebounced();"> Enable Faction Trackers</label></div>' +
      '<div class="check-row"><label><input type="checkbox" ' + (S.battle.isTTS ? 'checked' : '') + ' onchange="S.battle.isTTS=this.checked;saveDraftDebounced();"> TTS Game</label><span class="tts-note">TTS games are added to your personal record but not to the ladder.</span></div>' +
      '<div class="check-row"><label><input type="checkbox" ' + (S.battle.isTournament ? 'checked' : '') + ' onchange="S.battle.isTournament=this.checked;saveDraftDebounced();"> Tournament Game</label></div>' +
      '<div style="height:80px;"></div>' +
      '<button class="btn btn-g" onclick="Actions.startBattle()" style="margin-bottom:50px;">' + ic('swords', 18) + ' Begin Battle</button>' +
      UI.spacer(40) +
      '</div>' +
      renderFactionPicker('f1', S.battle.faction1 ? [S.battle.faction1] : []) +
      renderFactionPicker('f2', S.battle.faction2 ? [S.battle.faction2] : []) +
      oppSheet;
  }

  function renderLogScore() {
    const r = S.battle.rounds[S.battle.currentRound];
    if (!S.battle._cumulative || S.battle._cumulative.round !== S.battle.currentRound || S.battle._cumulative.version !== S.battle.rounds.length) {
      let cv1 = 0, cv2 = 0;
      for (let i = 0; i <= S.battle.currentRound; i++) { cv1 += S.battle.rounds[i].vp1 || 0; cv2 += S.battle.rounds[i].vp2 || 0; }
      S.battle._cumulative = { round: S.battle.currentRound, version: S.battle.rounds.length, cv1, cv2 };
    }
    const { cv1, cv2 } = S.battle._cumulative;
    const rv1 = (r.p1 || 0) + (r.t1 || 0);
    const rv2 = (r.p2 || 0) + (r.t2 || 0);
    const dots = Array.from({ length: CONFIG.MAX_ROUNDS }, (_, i) => '<div class="rdot' + (i <= S.battle.currentRound ? ' on' : '') + '"></div>').join('');
    const hist = S.battle.rounds.slice(0, S.battle.currentRound + 1).map((rd, i) => UI.statRow('Round ' + (i+1), (rd.vp1 || 0) + ' — ' + (rd.vp2 || 0))).join('');
    const cgp = S.battle.currentRound > 0;
    const cgn = S.battle.currentRound < CONFIG.MAX_ROUNDS - 1;
    const isUnderdogP1 = S.battle.underdog === 'p1';
    const isUnderdogP2 = S.battle.underdog === 'p2';
    const doubleActive = S.battle.doubleTurn !== null;
    const ft1 = renderFactionTracker('p1', S.battle.faction1, S.battle.useFactionTrackers);
    const ft2 = renderFactionTracker('p2', S.battle.faction2, S.battle.useFactionTrackers);
    let content1 = '', content2 = '';
    if (S.battle.useFactionTrackers) {
      const hasTracker1 = getTracker(S.battle.faction1) !== null;
      const hasTracker2 = getTracker(S.battle.faction2) !== null;
      if (hasTracker1 || hasTracker2) {
        content1 = ft1 ? ft1 : '<div class="faction-tracker-block" style="border-color:var(--bdr); background:var(--bg3); opacity:0.3; min-height:70px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); font-style:italic;">No faction tracker</div>';
        content2 = ft2 ? ft2 : '<div class="faction-tracker-block" style="border-color:var(--bdr); background:var(--bg3); opacity:0.3; min-height:70px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); font-style:italic;">No faction tracker</div>';
      }
    }
    return '<div style="padding:16px 16px 0"><div style="font-size:11px;letter-spacing:.1em;color:var(--parchDim);text-align:center">ROUND ' + (S.battle.currentRound+1) + ' OF ' + CONFIG.MAX_ROUNDS + '</div><div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0"><button class="btn btn-o btn-sm" style="width:auto;min-height:36px;padding:6px 14px" onclick="Actions.prevRound()" ' + (!cgp ? 'disabled style="opacity:.4"' : '') + '>' + ic('chevleft', 14) + ' Prev</button><div class="round-dots" style="margin:0">' + dots + '</div><button class="btn btn-o btn-sm" style="width:auto;min-height:36px;padding:6px 14px" onclick="Actions.nextRound()" ' + (!cgn ? 'disabled style="opacity:.4"' : '') + '>Next ' + ic('chevright', 14) + '</button></div>' +
    '<div style="display:flex;justify-content:center;gap:20px;padding:4px 0 8px"><div class="double-btn' + (S.battle.doubleTurn === 'p1' ? ' active' : '') + '" onclick="Actions.takeDouble(\'p1\')">Double Turn</div>' + (doubleActive ? '<div class="btn btn-o btn-sm" style="width:auto;min-height:28px;padding:3px 8px;font-size:10px" onclick="Actions.clearDouble()">Clear</div>' : '') + '<div class="double-btn' + (S.battle.doubleTurn === 'p2' ? ' active' : '') + '" onclick="Actions.takeDouble(\'p2\')">Double Turn</div></div></div>' +
    '<div class="score-wrap"><div class="score-col" style="border-right:1px solid var(--bdr);padding-right:8px"><div class="score-name">' + esc(S.auth.session.username) + (isUnderdogP1 ? ' <span class="underdog-badge">Underdog</span>' : '') + (S.battle.doubleTurn === 'p1' ? ' <span style="font-size:8px;color:var(--gold)">(Double)</span>' : '') + '</div><div style="font-size:11px;color:' + gaColor(gaFor(S.battle.faction1)) + '">' + esc(S.battle.faction1) + '</div>' +
    '<div class="resource-block" style="border-top:none;padding-top:0;margin-top:4px">' + UI.resourceStepper('p1fury', S.battle.resources.p1fury || 0, { label: 'Fury', max: CONFIG.FURY_MAX, color: 'var(--fury)' }) + UI.resourceStepper('p1rage', S.battle.resources.p1rage || 0, { label: 'Rage', color: 'var(--rage)' }) + UI.resourceStepper('p1cp', S.battle.resources.p1cp || 0, { label: 'CP', color: 'var(--cp)' }) + '</div>' +
    content1 +
    '<div class="score-total" id="score-total-p1">' + cv1 + '</div><div class="score-round-total">+' + rv1 + ' this round</div>' +
    '<div style="width:100%;margin-top:2px">' + UI.vpStepper('battle.rounds.' + S.battle.currentRound + '.p1', r.p1 || 0, { label: 'Primaries', max: CONFIG.SCORE.PRIMARY_MAX }) + '</div>' + renderTacticDisplay('p1') + '</div>' +

  function renderDashboard() {
    const games = DataCache.games;
    const users = DataCache.users;
    const ug = S.auth.session.isAdmin ? games : games.filter(g => g.player1 === S.auth.session.username || g.player2 === S.auth.session.username);
    let fg = S.ui.dashFilter === 'all' ? ug : ug.filter(g => g.player1 === S.ui.dashFilter || g.player2 === S.ui.dashFilter);
    fg.sort((a, b) => b.date.localeCompare(a.date));
    const tf = fg.length;
    const mw = fg.filter(g => g.winner === S.auth.session.username).length;
    const md = fg.filter(g => g.winner === 'draw').length;
    const ml = tf - mw - md;
    const mr = tf && (tf - md) > 0 ? Math.round(mw / (tf - md) * 100) : 0;
    let cu = ['all'];
    if (S.auth.session.isAdmin) {
      cu = ['all', ...Object.keys(users).filter(u => u !== CONFIG.SPECIAL_USERS.ADMIN && u !== S.auth.session.username)];
    } else {
      const o = [...new Set(ug.flatMap(g => [g.player1, g.player2]).filter(u => u !== S.auth.session.username && !CONFIG.NON_USERS.includes(u)))];
      cu = ['all', ...o];
    }
    const ci = cu.map(u => ({ value: u, label: u === 'all' ? 'All' : esc(users[u]?.username || u), onclick: 'Actions.setDashFilter(\'' + esc(u) + '\')' }));
    const sum = tf > 0 ? '<div class="dash-summary"><div class="dash-summary-item"><div class="dash-summary-val">' + tf + '</div><div class="dash-summary-lbl">Games</div></div><div class="dash-summary-item"><div class="dash-summary-val" style="color:var(--green)">' + mw + '</div><div class="dash-summary-lbl">Wins</div></div><div class="dash-summary-item"><div class="dash-summary-val" style="color:var(--gold)">' + md + '</div><div class="dash-summary-lbl">Draws</div></div><div class="dash-summary-item"><div class="dash-summary-val" style="color:var(--red)">' + ml + '</div><div class="dash-summary-lbl">Losses</div></div><div class="dash-summary-item"><div class="dash-summary-val">' + mr + '%</div><div class="dash-summary-lbl">Win Rate</div></div></div>' : '';
    const cards = fg.map(g => {
      const wn = dname(g.winner, g);
      const exp = S.ui.expandedGame === g.id;
      const isManual = g.manuallyEntered || g.manuallyUpdated;
      const isTournament = g.isTournament;
      const winnerDisplay = g.winner === 'draw' ? 'Draw' : wn;
      const detail = exp ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)">' + g.rounds.map((r, i) => UI.statRow('Round ' + (i+1), (r.vp1 || 0) + ' — ' + (r.vp2 || 0) + ' (P:' + (r.p1 || 0) + ' T:' + (r.t1 || 0) + ')')).join('') + (g.notes ? '<div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:6px;font-style:italic;font-size:13px;color:var(--parch)">"' + esc(g.notes) + '"</div>' : '') + '</div>' : '';
      const col1 = gaColor(g.grandAlliance1);
      const col2 = gaColor(g.grandAlliance2);
      return '<div class="card game-card"><div style="display:flex;justify-content:space-between;align-items:flex-start" onclick="Actions.toggleGameExpand(\'' + g.id + '\')"><div style="flex:1;min-width:0"><div class="gvs">' + esc(dname(g.player1, g)) + ' vs ' + esc(dname(g.player2, g)) + '</div><div style="font-size:12px;color:var(--dim);margin-top:2px">' + g.date + ' · ' + esc(g.scenario || 'Free Battle') + (g.isTTS ? ' <span class="badge tts-badge">TTS</span>' : '') + (isTournament ? ' <span class="badge tournament-badge">Tournament</span>' : '') + (isManual ? ' <span class="badge manual-badge">Manual</span>' : '') + (g.winner === 'draw' ? ' <span class="badge draw-badge">Draw</span>' : '') + '</div><div style="margin-top:5px"><span class="badge" style="background:' + col1 + '22;color:' + col1 + ';border:1px solid ' + col1 + '44;font-size:9px">' + esc(g.faction1) + '</span> <span class="badge" style="background:' + col2 + '22;color:' + col2 + ';border:1px solid ' + col2 + '44;font-size:9px">' + esc(g.faction2) + '</span></div></div><div style="text-align:right;flex-shrink:0;margin-left:12px"><div class="gscore">' + g.totalVP1 + '–' + g.totalVP2 + '</div><div style="font-size:11px;color:var(--gold);margin-top:3px">' + ic('trophy', 11) + ' ' + esc(winnerDisplay) + '</div><div style="margin-top:4px;color:var(--dim)">' + ic('chevdown', 14) + '</div></div></div>' + detail + '</div>';
    }).join('');
    return UI.sectionHeader('Battle Records') + UI.chips(ci, S.ui.dashFilter) + sum + (fg.length ? cards : UI.emptyState('No battles recorded yet.')) + UI.spacer();
  }

  function barChart(data, labelWidth) {
    if (!data.length) return UI.emptyState('No data');
    const W = Math.min((window.innerWidth || 380), 448) - 48;
    const max = Math.max(1, ...data.map(d => d.w + d.l + d.d));
    return '<div style="width:100%;padding:4px 0">' + data.map(d => {
      const total = d.w + d.l + d.d;
      const pct = total ? Math.round(d.w / total * 100) : 0;
      const drawPct = total && d.d ? Math.round(d.d / total * 100) : 0;
      const lossPct = total ? 100 - pct - drawPct : 0;
      const col = d.color || 'var(--parchDim)';
      let bars = '';
      if (pct > 0) bars += '<div style="width:' + pct + '%;height:100%;background:var(--green);border-radius:' + (drawPct > 0 || lossPct > 0 ? '4px 0 0 4px' : '4px') + ';transition:width .3s"></div>';
      if (drawPct > 0) bars += '<div style="width:' + drawPct + '%;height:100%;background:var(--gold);transition:width .3s"></div>';
      if (lossPct > 0) bars += '<div style="width:' + lossPct + '%;height:100%;background:var(--red);border-radius:' + (pct > 0 || drawPct > 0 ? '0 4px 4px 0' : '4px') + ';transition:width .3s"></div>';
      return '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px"><span style="width:' + (labelWidth || 90) + 'px;flex-shrink:0;color:' + col + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:' + (d.color ? 'bold' : 'normal') + '">' + esc(d.label) + '</span><div style="flex:1;height:16px;background:var(--bg3);border-radius:4px;overflow:hidden;display:flex">' + bars + '</div><span style="min-width:36px;text-align:right;font-size:11px;color:var(--gold)">' + pct + '%</span></div>';
    }).join('') + '</div>';
  }

  function renderStats() {
    const games = DataCache.games;
    const mu = S.auth.session.username;
    const now = new Date();
    const todayStr = now.toISOString().slice(0,10);
    let fromDate = new Date();
    fromDate.setMonth(fromDate.getMonth() - 3);
    let fromStr = fromDate.toISOString().slice(0,10);
    let toStr = todayStr;
    const preset = S.ui.statsDatePreset || '3m';
    if (preset === '1m') { fromDate = new Date(); fromDate.setMonth(fromDate.getMonth() - 1); fromStr = fromDate.toISOString().slice(0,10); }
    else if (preset === '3m') { fromDate = new Date(); fromDate.setMonth(fromDate.getMonth() - 3); fromStr = fromDate.toISOString().slice(0,10); }
    else if (preset === '12m') { fromDate = new Date(); fromDate.setFullYear(fromDate.getFullYear() - 1); fromStr = fromDate.toISOString().slice(0,10); }
    else fromStr = '2000-01-01';
    let allGames = games.filter(g => (g.player1 === mu || g.player2 === mu) && g.date >= fromStr && g.date <= toStr).sort((a,b) => a.date.localeCompare(b.date));
    const ownFactionsSet = new Set();
    allGames.forEach(g => { const myFaction = g.player1 === mu ? g.faction1 : g.faction2; if (myFaction) ownFactionsSet.add(myFaction); });
    const ownFactions = [...ownFactionsSet].sort();
    const hasTTS = allGames.some(g => g.isTTS);
    const hasTournament = allGames.some(g => g.isTournament);
    let myGames = allGames;
    if (S.ui.statsTTSFilter === 'tts') myGames = myGames.filter(g => g.isTTS);
    else if (S.ui.statsTTSFilter === 'tabletop') myGames = myGames.filter(g => !g.isTTS);
    if (S.ui.statsTournamentFilter === 'tournament') myGames = myGames.filter(g => g.isTournament);
    else if (S.ui.statsTournamentFilter === 'casual') myGames = myGames.filter(g => !g.isTournament);
    const factionFilter = S.ui.statsFactionFilter;
    if (factionFilter && factionFilter !== 'all') {
      myGames = myGames.filter(g => { const myFaction = g.player1 === mu ? g.faction1 : g.faction2; return myFaction === factionFilter; });
    }
    const tabs = ['Performance', 'Battle Plans', 'Tactics', 'Matchups'];
    let content = '';
    const presetBtns = [{ key: '1m', label: '1M' }, { key: '3m', label: '3M' }, { key: '12m', label: '12M' }, { key: 'all', label: 'All' }];
    const dateRow = '<div class="sort-row" style="justify-content:center;gap:6px;padding:4px 16px 8px">' + presetBtns.map(p => '<div class="sort-chip' + (S.ui.statsDatePreset === p.key ? ' on' : '') + '" onclick="Actions.setStatsDatePreset(\'' + p.key + '\')">' + p.label + '</div>').join('') + '</div>';
    let ttsRow = '';
    if (hasTTS) { ttsRow = '<div class="stats-toggle" style="padding:0 16px 4px"><div class="stats-toggle-btn' + (S.ui.statsTTSFilter === 'all' ? ' on' : '') + '" onclick="Actions.setStatsTTSFilter(\'all\')">All</div><div class="stats-toggle-btn' + (S.ui.statsTTSFilter === 'tabletop' ? ' on' : '') + '" onclick="Actions.setStatsTTSFilter(\'tabletop\')">Tabletop</div><div class="stats-toggle-btn' + (S.ui.statsTTSFilter === 'tts' ? ' on' : '') + '" onclick="Actions.setStatsTTSFilter(\'tts\')">TTS</div></div>'; }
    let tournRow = '';
    if (hasTournament) { tournRow = '<div class="stats-toggle" style="padding:0 16px 4px"><div class="stats-toggle-btn' + (S.ui.statsTournamentFilter === 'all' ? ' on' : '') + '" onclick="Actions.setStatsTournamentFilter(\'all\')">All</div><div class="stats-toggle-btn' + (S.ui.statsTournamentFilter === 'casual' ? ' on' : '') + '" onclick="Actions.setStatsTournamentFilter(\'casual\')">Casual</div><div class="stats-toggle-btn' + (S.ui.statsTournamentFilter === 'tournament' ? ' on' : '') + '" onclick="Actions.setStatsTournamentFilter(\'tournament\')">Tournament</div></div>'; }
    let factionRow = '';
    if (ownFactions.length > 1) {
      let factionOpts = '<option value="all" ' + (factionFilter === 'all' ? 'selected' : '') + '>All Factions</option>';
      ownFactions.forEach(f => { factionOpts += '<option value="' + esc(f) + '" ' + (factionFilter === f ? 'selected' : '') + '>' + esc(f) + '</option>'; });
      factionRow = '<div style="padding:4px 16px 12px"><label style="font-size:11px;color:var(--parch);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px;">Your Faction</label><select class="tac-select" onchange="Actions.setStatsFactionFilter(this.value)" style="max-width:200px;">' + factionOpts + '</select></div>';
    }
    if (S.ui.statsTab === 0) {
      const tw = myGames.filter(g => g.winner === mu).length;
      const td = myGames.filter(g => g.winner === 'draw').length;
      const tg = myGames.length, tl = tg - tw - td;
      const wp = tg && (tg - td) > 0 ? Math.round(tw / (tg - td) * 100) : 0;
      const W = Math.min((window.innerWidth || 380), 448) - 32;
      let ch = '';
      if (myGames.length < 2) ch = UI.emptyState('Need at least 2 games');
      else {
        const isR = S.ui.statsMode === 'ratio';
        const pts = [];
        if (isR) {
          let w = 0, d = 0;
          myGames.forEach((g, i) => {
            if (g.winner === mu) w++;
            else if (g.winner === 'draw') d++;
            const effective = (i+1) - d;
            pts.push({ x: i + 1, y: effective ? Math.round(w / effective * 100) : 0, label: g.date.slice(5), above50: effective ? (w / effective) >= 0.5 : false });
          });
        } else {
          let w = 0;
          myGames.forEach((g, i) => {
            if (g.winner === mu) w++;
            pts.push({ x: i + 1, y: w, label: g.date.slice(5), won: g.winner === mu });
          });
        }
        const mxY = isR ? 100 : Math.max(pts[pts.length - 1].y, 1);
        const pH = 180, pW = W - 40;
        let ptsS = '', lbs = '', dts = '';
        const showWeekly = pts.length > 14;
        pts.forEach((p, i) => {
          const x = 40 + Math.round((i / (pts.length - 1)) * pW);
          const y = pH - Math.round((p.y / mxY) * pH) + 10;
          ptsS += x + ',' + y + ' ';
          let label = p.label;
          if (showWeekly && i % 7 !== 0) label = '';
          lbs += '<text x="' + x + '" y="' + (pH + 30) + '" text-anchor="middle" fill="#888070" font-size="9">' + esc(label) + '</text>';
          const dc = isR ? (p.above50 ? '#c9a84c' : '#c0392b') : (p.won ? '#c9a84c' : '#c0392b');
          dts += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + dc + '"/>';
        });
        let rl = '';
        if (isR) {
          const ry = pH - Math.round((50 / mxY) * pH) + 10;
          rl = '<line x1="36" y1="' + ry + '" x2="' + W + '" y2="' + ry + '" stroke="rgba(201,168,76,.3)" stroke-dasharray="4,4"/><text x="34" y="' + (ry + 4) + '" text-anchor="end" fill="rgba(201,168,76,.5)" font-size="8">50%</text>';
        }
        let gd = '';
        const gs = isR ? [0, 25, 50, 75, 100] : Array.from({ length: mxY + 1 }, (_, i) => i).filter(v => v % Math.ceil(mxY / 5) === 0 || v === mxY);
        gs.forEach(v => {
          const y = pH - Math.round((v / mxY) * pH) + 10;
          gd += '<line x1="36" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="rgba(201,168,76,.1)"/><text x="34" y="' + (y + 4) + '" text-anchor="end" fill="#888070" font-size="9">' + v + '</text>';
        });
        ch = '<div class="chart-wrap"><svg width="' + W + '" height="230" style="display:block">' + gd + rl + '<polyline points="' + ptsS.trim() + '" fill="none" stroke="#c9a84c" stroke-width="2"/>' + dts + lbs + '</svg></div>';
      }
      const tgH = '<div class="stats-toggle"><div class="stats-toggle-btn' + (S.ui.statsMode === 'wins' ? ' on' : '') + '" onclick="Actions.setStatsMode(\'wins\')">Cumulative Wins</div><div class="stats-toggle-btn' + (S.ui.statsMode === 'ratio' ? ' on' : '') + '" onclick="Actions.setStatsMode(\'ratio\')">Win/Loss Ratio</div></div>';
      const dataGrid = '<div class="stats-data-grid"><div class="stat-item"><div class="stat-val">' + tg + '</div><div class="stat-lbl">Games</div></div><div class="stat-item"><div class="stat-val" style="color:var(--green)">' + tw + '</div><div class="stat-lbl">Wins</div></div><div class="stat-item"><div class="stat-val" style="color:var(--gold)">' + td + '</div><div class="stat-lbl">Draws</div></div><div class="stat-item"><div class="stat-val" style="color:var(--red)">' + tl + '</div><div class="stat-lbl">Losses</div></div><div class="stat-item"><div class="stat-val">' + wp + '%</div><div class="stat-lbl">Win Rate</div></div></div>';
      content = UI.card('Your Performance', dataGrid) + UI.card('Performance Over Time', tgH + ch);
    } else if (S.ui.statsTab === 1) {
      const ps = {};
      myGames.forEach(g => { const p = g.scenario || 'Unknown'; if (!ps[p]) ps[p] = { w:0, l:0, d:0 }; if (g.winner === mu) ps[p].w++; else if (g.winner === 'draw') ps[p].d++; else ps[p].l++; });
      const entries = Object.entries(ps).sort((a,b) => (b[1].w + b[1].l + b[1].d) - (a[1].w + a[1].l + a[1].d)).map(([label, { w, l, d }]) => ({ label, w, l, d }));
      let dataRows = entries.length ? '<div style="margin-bottom:12px">' + entries.map(d => { const total = d.w + d.l + d.d; const pct = total ? Math.round(d.w / total * 100) : 0; return UI.statRow(d.label, d.w + 'W ' + d.d + 'D ' + d.l + 'L (' + pct + '%)'); }).join('') + '</div>' : UI.emptyState('No data yet');
      content = UI.card('Battle Plan Win/Loss', dataRows + barChart(entries, 90));
    } else if (S.ui.statsTab === 2) {
      const ts = {}; CONFIG.BATTLE_TACTICS.forEach(t => { ts[t.name] = { w:0, l:0, d:0 }; });
      myGames.forEach(g => {
        const p1Tactics = g.p1TacticsUsed || [];
        const p2Tactics = g.p2TacticsUsed || [];
        const isP1 = g.player1 === mu;
        const myTactics = isP1 ? p1Tactics : p2Tactics;
        myTactics.forEach(tn => { if (ts[tn]) { if (g.winner === mu) ts[tn].w++; else if (g.winner === 'draw') ts[tn].d++; else ts[tn].l++; } });
      });
      const entries = Object.entries(ts).filter(([n,s]) => s.w + s.l + s.d > 0).sort((a,b) => (b[1].w + b[1].l + b[1].d) - (a[1].w + a[1].l + a[1].d)).map(([label, { w, l, d }]) => ({ label, w, l, d }));
      let dataRows = entries.length ? '<div style="margin-bottom:12px">' + entries.map(d => { const total = d.w + d.l + d.d; const pct = total ? Math.round(d.w / total * 100) : 0; return UI.statRow(d.label, d.w + 'W ' + d.d + 'D ' + d.l + 'L (' + pct + '%)'); }).join('') + '</div>' : UI.emptyState('No tactic data yet');
      content = UI.card('Battle Tactic Win/Loss', dataRows + barChart(entries, 100));
    } else if (S.ui.statsTab === 3) {
      const matchups = {};
      myGames.forEach(g => {
        const isP1 = g.player1 === mu;
        const oppFaction = isP1 ? g.faction2 : g.faction1;
        if (!oppFaction || (CONFIG.NON_USERS.includes(g.player2) && !isP1) || (CONFIG.NON_USERS.includes(g.player1) && isP1)) return;
        if (!matchups[oppFaction]) matchups[oppFaction] = { w:0, l:0, d:0 };
        if (g.winner === mu) matchups[oppFaction].w++;
        else if (g.winner === 'draw') matchups[oppFaction].d++;
        else matchups[oppFaction].l++;
      });
      let entries = Object.entries(matchups).map(([label, { w, l, d }]) => ({ label, w, l, d }));
      entries.sort((a,b) => (b.w + b.l + b.d) - (a.w + a.l + a.d));
      let dataRows = entries.length ? '<div style="margin-bottom:12px">' + entries.map(d => { const total = d.w + d.l + d.d; const pct = total ? Math.round(d.w / total * 100) : 0; return UI.statRow(d.label, d.w + 'W ' + d.d + 'D ' + d.l + 'L (' + pct + '%)'); }).join('') + '</div>' : UI.emptyState('No matchup data yet');
      content = UI.card('Matchup Win/Loss', barChart(entries, 110) + dataRows);
    } else content = UI.emptyState('Select a tab above.');
    return UI.sectionHeader('Statistics') + dateRow + ttsRow + tournRow + factionRow + UI.tabRow(tabs, S.ui.statsTab, 'Actions.setStatsTab') + content + UI.spacer();
  }

  function renderLeaderboard() {
    const games = DataCache.games;
    const users = DataCache.users;
    const filter = S.ui.lbTournamentFilter || 'all';
    let ul = Object.values(users).filter(u => !u.isAdmin);
    const lb = ul.map(u => {
      let mg = games.filter(g => (g.player1 === u.username || g.player2 === u.username));
      mg = mg.filter(g => !g.isTTS);
      if (filter === 'tournament') mg = mg.filter(g => g.isTournament);
      else if (filter === 'casual') mg = mg.filter(g => !g.isTournament);
      const wins = mg.filter(g => g.winner === u.username).length;
      const draws = mg.filter(g => g.winner === 'draw').length;
      const losses = mg.length - wins - draws;
      const fc = {};
      mg.forEach(g => { const f = g.player1 === u.username ? g.faction1 : g.faction2; if (f) fc[f] = (fc[f] || 0) + 1; });
      const fav = Object.entries(fc).sort((a,b) => b[1] - a[1])[0]?.[0] || u.factions[0] || null;
      const ga = fav ? gaFor(fav) : null;
      const pct = mg.length && (mg.length - draws) > 0 ? (wins / (mg.length - draws) * 100) : 0;
      return { ...u, wins, draws, losses, gp: mg.length, pct: Math.round(pct), fav, ga };
    });
    if (S.ui.lbSort === 'wins') lb.sort((a,b) => b.wins - a.wins || b.pct - a.pct);
    else if (S.ui.lbSort === 'ratio') lb.sort((a,b) => b.pct - a.pct || b.wins - a.wins);
    else if (S.ui.lbSort === 'name') lb.sort((a,b) => a.username.localeCompare(b.username));
    S.ui.lbUsers = lb;
    let gg = games.filter(g => g.player1 === CONFIG.SPECIAL_USERS.GUEST || g.player2 === CONFIG.SPECIAL_USERS.GUEST);
    gg = gg.filter(g => !g.isTTS);
    if (filter === 'tournament') gg = gg.filter(g => g.isTournament);
    else if (filter === 'casual') gg = gg.filter(g => !g.isTournament);
    const gw = gg.filter(g => g.winner === CONFIG.SPECIAL_USERS.GUEST).length;
    const gd = gg.filter(g => g.winner === 'draw').length;
    const gn = [...new Set(gg.map(g => g.guestName).filter(Boolean))];
    const so = [{ value: 'wins', label: 'Wins' }, { value: 'ratio', label: 'Win Ratio' }, { value: 'name', label: 'Name' }];
    const lbFilterChips = [{ value: 'all', label: 'All' }, { value: 'casual', label: 'Casual' }, { value: 'tournament', label: 'Tournament' }];
    const filterRow = '<div class="sort-row" style="justify-content:center;gap:6px;padding:4px 16px 8px">' + lbFilterChips.map(c => '<div class="sort-chip' + (S.ui.lbTournamentFilter === c.value ? ' on' : '') + '" onclick="Actions.setLbTournamentFilter(\'' + c.value + '\')">' + c.label + '</div>').join('') + '</div>';
    const cards = lb.map((u, i) => '<div class="card" style="cursor:pointer;' + (i === 0 ? 'border-color:var(--gold)' : '') + '" onclick="Actions.openLBModal(' + i + ')"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:' + (i === 0 ? '26' : '20') + 'px;width:38px;text-align:center">' + (i === 0 ? '🏆' : '#' + (i+1)) + '</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:bold;font-size:15px">' + esc(u.username) + '</span>' + UI.factionBadge(u.ga) + '</div><div style="font-size:12px;color:var(--dim);margin-top:2px">' + esc(u.fav || 'No faction recorded') + '</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:20px;font-weight:bold;color:var(--gold)">' + u.pct + '%</div><div style="font-size:11px;color:var(--dim)">' + u.wins + 'W ' + u.draws + 'D ' + u.losses + 'L</div></div></div></div>').join('');
    const gc = gg.length ? '<div class="card" style="border-style:dashed;opacity:.8;cursor:pointer" onclick="Actions.openGuestModal()"><div style="display:flex;align-items:center;gap:12px"><div style="width:38px;text-align:center;font-size:22px">👤</div><div style="flex:1"><div style="font-weight:bold">Guest Players</div><div style="font-size:12px;color:var(--dim)">' + esc(gn.slice(0,3).join(', ') + (gn.length > 3 ? ' +' + (gn.length-3) + ' more' : '')) + '</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:bold;color:var(--dim)">' + (gg.length && (gg.length - gd) > 0 ? Math.round(gw / (gg.length - gd) * 100) : 0) + '%</div><div style="font-size:11px;color:var(--dim)">' + gw + 'W ' + gd + 'D ' + (gg.length - gw - gd) + 'L</div></div></div></div>' : '';
    let md = '';
    if (S.ui.modal?.type === 'player') {
      const u = S.ui.modal.user;
      md = '<div class="overlay" onclick="Actions.closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sh-handle"></div><div class="sh-head">' + esc(u.username) + '</div><div class="sh-body" style="padding:0 16px 16px">' + [['Games Played', u.gp], ['Wins', u.wins], ['Draws', u.draws], ['Losses', u.losses], ['Win %', u.pct + '%'], ['Grand Alliance', u.ga || '—'], ['Favourite Faction', u.fav || '—']].map(([l, v]) => UI.statRow(l, v)).join('') + '</div></div></div>';
    } else if (S.ui.modal?.type === 'guests') {
      const rows = gn.map(n => {
        const ng = gg.filter(g => g.guestName === n);
        const nw = ng.filter(g => g.winner === CONFIG.SPECIAL_USERS.GUEST).length;
        const nd = ng.filter(g => g.winner === 'draw').length;
        return UI.statRow(n, nw + 'W ' + nd + 'D ' + (ng.length - nw - nd) + 'L');
      }).join('');
      md = '<div class="overlay" onclick="Actions.closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sh-handle"></div><div class="sh-head">Guest Players (Combined)</div><div class="sh-body" style="padding:0 16px 16px">' + [['Games', gg.length], ['Wins', gw], ['Draws', gd], ['Losses', gg.length - gw - gd], ['Win %', gg.length && (gg.length - gd) > 0 ? Math.round(gw / (gg.length - gd) * 100) + '%' : '—']].map(([l, v]) => UI.statRow(l, v)).join('') + '<div style="margin-top:12px;font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Individual Guests</div>' + rows + '<div style="margin-top:12px;font-size:12px;color:var(--dim);font-style:italic">Guests are not ranked.</div></div></div></div>';
    }
    return UI.sectionHeader('Leaderboard', 'Champions of the Mortal Realms') + filterRow + UI.sortChips(so, S.ui.lbSort, 'Actions.setLbSort') + (!lb.length ? UI.emptyState('No warriors yet.') : cards) + gc + md + UI.spacer();
  }

  function renderProfile() {

    const draws = mg.filter(g => g.winner === 'draw').length;
    const fl = S.profile.factions.length ? S.profile.factions.slice(0,2).join(', ') + (S.profile.factions.length > 2 ? ' +' + (S.profile.factions.length-2) : '') : 'Select factions…';
    const aw = S.auth.session.isAdmin && !DataCache.user('admin')?.adminPasswordChanged;
    return UI.sectionHeader('My Profile', S.auth.session.username) + (aw ? UI.warning('Default admin credentials active — change in Admin → My Account') : '') +
      UI.card('Stats', [['Games', mg.length], ['Wins', wins], ['Draws', draws], ['Losses', mg.length - wins - draws], ['Win %', mg.length && (mg.length - draws) > 0 ? Math.round(wins / (mg.length - draws) * 100) + '%' : '—']].map(([l, v]) => UI.statRow(l, v)).join('')) +

      UI.card('Change Password', UI.formField('Current Password', UI.passwordInput('profile.curPw', { oninput: 'S.profile.curPw=this.value' })) + UI.formField('New Password', UI.passwordInput('profile.newPw', { oninput: 'S.profile.newPw=this.value' })) + UI.formField('Confirm New', UI.passwordInput('profile.conf', { oninput: 'S.profile.conf=this.value' })) + '<button class="btn btn-o" onclick="Actions.changePw()">' + ic('lock', 14) + ' Change Password</button>') +
      '<div class="card" style="border-color:rgba(231,76,60,.3)"><div class="ct" style="color:var(--red)">Danger Zone</div><button class="btn btn-d" onclick="Actions.toggleDeleteConfirm()">Delete My Account</button>' + (S.profile.showDel ? '<div style="margin-top:12px">' + UI.formField('Type username to confirm', UI.textInput('profile.delConf', { placeholder: S.auth.session.username, value: S.profile.delConf })) + '<button class="btn btn-d" onclick="Actions.deleteMyAccount()">Confirm Delete</button></div>' : '') + '</div>' + renderFactionPicker('prof', S.profile.factions) + UI.spacer();
  }

    const tabs = ['Users', 'Games', 'My Account', 'App Stats', 'Export'];
    const users = DataCache.users;
    const games = DataCache.games;
    const ul = Object.values(users).filter(u => !u.isAdmin);
    let ct = '';
    if (S.admin.tab === 0) {
      ct = ul.map(u => {
        const exp = S.admin.expandedUser === u.username;
        let tr = '';
        if (exp) {
          tr = '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:8px">' +
            (S.admin.resetTarget === u.username ? UI.formField('New Password for ' + esc(u.username), UI.passwordInput('admin.resetPw', { placeholder: 'New password' })) + '<div class="btn-row"><button class="btn btn-o btn-sm" onclick="Actions.cancelResetPw()">Cancel</button><button class="btn btn-g btn-sm" onclick="Actions.doResetPw(\'' + esc(u.username) + '\')">' + ic('check', 14) + ' Confirm Reset</button></div>' : '<button class="btn btn-o btn-sm" onclick="Actions.showResetPw(\'' + esc(u.username) + '\')">' + ic('lock', 14) + ' Reset Password</button>') +
            (S.admin.editTarget === u.username ? UI.formField('New Display Name', UI.textInput('admin.editName', { value: S.admin.editName })) + '<div class="btn-row"><button class="btn btn-o btn-sm" onclick="Actions.cancelEditName()">Cancel</button><button class="btn btn-g btn-sm" onclick="Actions.doEditName(\'' + esc(u.username) + '\')">' + ic('check', 14) + ' Save</button></div>' : '<button class="btn btn-o btn-sm" onclick="Actions.showEditName(\'' + esc(u.username) + '\')">' + ic('edit', 14) + ' Edit Name</button>') +
            '<button class="btn btn-sm ' + (u.isSuspended ? 'btn-g' : 'btn-o') + '" onclick="Actions.doToggleSuspend(\'' + esc(u.username) + '\')">' + ic('refresh', 14) + ' ' + (u.isSuspended ? 'Unsuspend' : 'Suspend') + '</button>' +
            (S.admin.confDel === u.username ? '<div style="font-size:13px;color:var(--red);margin-bottom:6px">Type username to confirm:</div>' + UI.textInput('admin.delInput', { placeholder: u.username, value: S.admin.delInput }) + '<div class="btn-row" style="margin-top:8px"><button class="btn btn-o btn-sm" onclick="Actions.cancelDeleteUser()">Cancel</button><button class="btn btn-d btn-sm" onclick="Actions.doDeleteUser(\'' + esc(u.username) + '\')">' + ic('trash', 14) + ' Delete</button></div>' : '<button class="btn btn-d btn-sm" onclick="Actions.showDeleteUser(\'' + esc(u.username) + '\')">' + ic('trash', 14) + ' Delete Account</button>') +
            '</div>';
        }
        return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer" onclick="Actions.toggleUserExpand(\'' + esc(u.username) + '\')"><div><div style="display:flex;gap:8px;align-items:center"><span style="font-weight:bold">' + esc(u.username) + '</span>' + (u.isSuspended ? ' <span class="susp">SUSPENDED</span>' : '') + '</div><div style="font-size:12px;color:var(--dim);margin-top:2px">@' + esc(u.username) + ' · ' + (u.gamesPlayed || 0) + ' games · ' + (u.wins || 0) + ' wins · ' + (u.draws || 0) + ' draws</div></div><span style="color:var(--dim)">' + ic('chevdown', 14) + '</span></div>' + tr + '</div>';
      }).join('') || UI.emptyState('No registered users yet.');
    } else if (S.admin.tab === 1) {
      let cs = '';
      if (S.admin.confDelGameId) {
        const g = games.find(g => g.id === S.admin.confDelGameId);
        if (g) {
          cs = '<div class="overlay" onclick="Actions.cancelDeleteGame()"><div class="sheet" onclick="event.stopPropagation()"><div class="sh-handle"></div><div style="padding:20px 16px"><div style="font-size:16px;color:var(--gold);font-weight:bold;margin-bottom:8px">Delete Game?</div><div style="font-size:14px;color:var(--parch);line-height:1.5;margin-bottom:20px">' + esc(dname(g.player1, g)) + ' vs ' + esc(dname(g.player2, g)) + ' on ' + g.date + '.<br>Stats recalculated.</div><div class="btn-row"><button class="btn btn-o" onclick="Actions.cancelDeleteGame()">Cancel</button><button class="btn btn-d" onclick="Actions.doDeleteGame()">Delete</button></div></div></div></div>';
        }
      }
      ct = games.map(g => '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:13px;font-weight:bold">' + esc(dname(g.player1, g)) + ' vs ' + esc(dname(g.player2, g)) + '</div><div style="font-size:12px;color:var(--dim);margin-top:2px">' + g.date + ' · ' + esc(g.scenario || 'Free Battle') + '</div><div style="font-size:13px;color:var(--gold);margin-top:2px;font-weight:bold">' + g.totalVP1 + '–' + g.totalVP2 + '</div></div><button class="btn btn-d btn-sm" style="width:auto;flex-shrink:0;margin-left:12px" onclick="Actions.showDeleteGame(\'' + esc(g.id) + '\')">' + ic('trash', 14) + '</button></div></div>').join('') + (games.length ? '' : UI.emptyState('No games logged.')) + cs;
    } else if (S.admin.tab === 2) {
      ct = '<div style="padding:12px 16px 0">' + UI.card('Admin Display Name', UI.formField('Display Name', UI.textInput('admin.name', { value: S.admin.name }))) + UI.card('Change Admin Password', UI.formField('New Password', UI.passwordInput('admin.newPw', { placeholder: 'Leave blank to keep current' })) + UI.formField('Confirm New Password', UI.passwordInput('admin.confPw')) + '<button class="btn btn-g" onclick="Actions.saveAdminProfile()">Save Admin Profile</button>') + '</div>';
    } else if (S.admin.tab === 3) {
      const cnt = {}, wc = {}, dc = {};
      games.forEach(g => {
        if (!CONFIG.NON_USERS.includes(g.player1)) cnt[g.player1] = (cnt[g.player1] || 0) + 1;
        if (!CONFIG.NON_USERS.includes(g.player2)) cnt[g.player2] = (cnt[g.player2] || 0) + 1;
        if (g.winner && !CONFIG.NON_USERS.includes(g.winner)) wc[g.winner] = (wc[g.winner] || 0) + 1;
        if (g.winner === 'draw') dc[g.winner] = (dc[g.winner] || 0) + 1;
      });
      const ta = Object.entries(cnt).sort((a,b) => b[1] - a[1])[0];
      const tw = Object.entries(wc).sort((a,b) => b[1] - a[1])[0];
      ct = UI.card('Overview', [['Total Users', ul.length], ['Total Games', games.length], ['Most Active', ta ? (users[ta[0]]?.username || ta[0]) : '—'], ['Leaderboard #1', tw ? (users[tw[0]]?.username || tw[0]) : '—']].map(([l, v]) => UI.statRow(l, v)).join(''));
    } else if (S.admin.tab === 4) {
      const userList = Object.values(users).filter(u => !u.isAdmin);
      const options = '<option value="all">All Users</option>' + userList.map(u => '<option value="' + esc(u.username) + '" ' + (S.admin.exportUser === u.username ? 'selected' : '') + '>' + esc(u.username) + '</option>').join('');
      ct = '<div style="padding:12px 16px">' +
        UI.card('Export User Profiles', '<p style="font-size:13px;color:var(--parch);margin-bottom:12px;">Download a JSON file with all registered user profiles (excludes passwords).</p><button class="btn btn-g" onclick="Actions.exportData(\'profiles\')">' + ic('download', 16) + ' Download Profiles</button>') +
        UI.card('Export All Games', '<p style="font-size:13px;color:var(--parch);margin-bottom:12px;">Download all battle records in JSON format.</p><button class="btn btn-g" onclick="Actions.exportData(\'games_all\')">' + ic('download', 16) + ' Download All Games</button>') +
        UI.card('Export User Games', '<p style="font-size:13px;color:var(--parch);margin-bottom:12px;">Select a user to download all their games.</p><div class="field"><label class="lbl">Select User</label><select class="tac-select" onchange="S.admin.exportUser=this.value;render(true);">' + options + '</select></div><button class="btn btn-g" onclick="Actions.exportData(\'games_user\')" ' + (S.admin.exportUser === 'all' ? 'disabled style="opacity:0.5;"' : '') + '>' + ic('download', 16) + ' Download User Games</button>') +
        '</div>';
    }
    return '<div class="adm-head"><div style="display:flex;align-items:center;gap:10px">' + ic('crown', 20, '#a07830') + '<div class="adm-title">Grand Marshal\'s Chamber</div></div><div style="font-size:12px;color:var(--gold2);margin-top:3px;font-style:italic">Administrative Access</div></div>' + UI.tabRow(tabs, S.admin.tab, 'Actions.setAdminTab') + ct + UI.spacer();
  }

  // ─── INIT ──────────────────────────────────────────────────────────
  async function loadAllData() {
    const { data: profiles, error: profilesError } = await supabaseClient
      .from('profiles')
      .select('*');
    if (profilesError) throw profilesError;
    S._allUsers = {};
    profiles.forEach(p => {
      S._allUsers[p.username] = {
        username: p.username,
        displayName: p.display_name,
        factions: p.factions || [],
        isAdmin: p.is_admin,
        isSuspended: p.is_suspended,
        joinedAt: p.joined_at,
        gamesPlayed: p.games_played,
        wins: p.wins,
        draws: p.draws,
      };
    });
    if (S.auth.session) {
      S._allGames = await loadGamesForUser(S.auth.session.username);
    } else {
      S._allGames = [];
    }
  }

  async function initApp() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const username = session.user.email.split('@')[0];
      try {
        const profile = await loadProfile(username);
        if (profile) {
          S.auth.session = {
            username: profile.username,
            displayName: profile.display_name,
            factions: profile.factions || [],
            isAdmin: profile.is_admin,
            isSuspended: profile.is_suspended,
            joinedAt: profile.joined_at,
            gamesPlayed: profile.games_played,
            wins: profile.wins,
            draws: profile.draws,
          };
        }
      } catch (e) {
        // Profile not found – clear the session and go to login
        if (e.code === 'PGRST116') {
          await signOut();
          S.auth.session = null;
        } else {
          throw e;
        }
      }
    }
    await loadAllData();
    S.ui.loading = false;
    render(true);
  } catch (e) {
    console.error('Init error:', e);
    toast('Failed to load data. Please refresh.', true);
    S.ui.loading = false;
    render(true);
  }
}

  let renderScheduled = false;
  let forceNextRender = false;

  function render(force, scrollTop) {
    if (force) forceNextRender = true;
    if (renderScheduled && !force) return;
    renderScheduled = true;
    const scr = document.getElementById('scr');
    const st = scr ? scr.scrollTop : 0;
    const targetScroll = (scrollTop !== undefined) ? scrollTop : st;
    requestAnimationFrame(() => {
      renderScheduled = false;
      _doRender();
      const ns = document.getElementById('scr');
      if (ns) ns.scrollTop = targetScroll;
      forceNextRender = false;
    });
  }

  function renderPreservingScroll(force) { render(force); }

  function _doRender() {
    const app = document.getElementById('app');
    if (!app) return;
    if (!S.auth.session) {
      app.innerHTML = renderLogin();
      S.nav.currentScreen = 'login';
      return;
    }
    if (S.auth.session) {
      loadDraft(S.auth.session.username).then(draft => {
        S.ui.draftExists = !!draft;
      });
    }
    const st = getScreenType();
    if (forceNextRender || S.nav.currentScreen !== st || st.startsWith('log_')) {
      app.innerHTML = '<div class="screen" id="scr">' + renderScreen() + '</div>' + renderNav();
      S.nav.currentScreen = st;
    } else {
      const scr = document.getElementById('scr');
      if (scr) scr.innerHTML = renderScreen();
    }
    forceNextRender = false;
  }

  function getScreenType() {
    if (!S.auth.session) return 'login';
    switch (S.nav.tab) {
      case 0: return 'landing';
      case 1: return 'log_' + S.battle.step;
      case 2: return 'dashboard';
      case 3: return 'stats';
      case 4: return 'leaderboard';
      case 5: return 'profile';
      case 6: return S.auth.session.isAdmin ? 'admin' : 'landing';
      default: return 'landing';
    }
  }

  function renderScreen() {
    switch (S.nav.tab) {
      case 0: return renderLanding();
      case 1: return renderLogGame();
      case 2: return renderDashboard();
      case 3: return renderStats();
      case 4: return renderLeaderboard();
      case 5: return renderProfile();
      case 6: return S.auth.session.isAdmin ? renderAdmin() : renderLanding();
      default: return renderLanding();
    }
  }

  function renderNav() {
    const tabs = [
      { i: 'shield', l: 'Home' },
      { i: 'swords', l: 'Battle Record' },
      { i: 'chart', l: 'Records' },
      { i: 'trophy', l: 'Stats' },
      { i: 'crown', l: 'Ranks' },
      { i: 'user', l: 'Profile' }
    ];
    if (S.auth.session && S.auth.session.isAdmin) tabs.push({ i: 'lock', l: 'Admin', admin: true });
    tabs.push({ i: 'logout', l: 'Out', out: true });
    return '<nav class="bnav">' + tabs.map((t, idx) => {
      if (t.out) return '<button class="nt" onclick="Actions.logout()">' + ic('logout', 20) + '<span>Out</span></button>';
      return '<button class="nt ' + (S.nav.tab === idx ? 'on' : '') + (t.admin ? ' admin-tab' : '') + '" onclick="Actions.goToTab(' + idx + ')">' + ic(t.i, 20) + '<span>' + t.l + '</span></button>';
    }).join('') + '</nav>';
  }

  initApp();

  window.Actions = Actions;
  window.ic = ic;
  window.esc = esc;
  window.UI = UI;
  window.TacticManager = TacticManager;

})(); // end IIFE
</script>
