<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="icon" href="warduckicon.ico">
<link rel="apple-touch-icon" href="warduckicon.ico">
<meta name="theme-color" content="#0a0a0a">
  <title>AoS Battle Tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0a;--bg2:#111;--bg3:#181818;--bg4:#222;
      --gold:#c9a84c;--gold2:#a07830;--gold3:#e8c86a;--goldDim:rgba(201,168,76,.15);
      --parch:#c4b08a;--parchDim:rgba(196,176,138,.6);
      --order:#4a90d9;--chaos:#c0392b;--death:#8e44ad;--destr:#27ae60;
      --red:#e74c3c;--green:#2ecc71;--fury:#e67e22;--rage:#e74c3c;--cp:#3498db;
      --text:#e8e0d0;--dim:#888070;
      --bdr:rgba(201,168,76,.25);--bdrBt:rgba(201,168,76,.6);
      --bnav:68px;--r:10px;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,serif;font-size:16px;overflow:hidden}
    #app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
    .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--bnav)+220px+env(safe-area-inset-bottom,0px));padding-top:max(env(safe-area-inset-top,0px),24px);-webkit-overflow-scrolling:touch}
    .screen::-webkit-scrollbar{display:none}
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--bnav);background:#0d0d0d;border-top:1px solid var(--bdr);display:flex;align-items:stretch;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
    .nt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--dim);font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:4px 2px;border:none;background:none;font-family:Georgia,serif}
    .nt.on{color:var(--gold)}
    .nt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .nt.admin-tab{border-left:1px solid var(--bdr);color:var(--gold2)}
    .nt.admin-tab.on{color:var(--gold3)}
    .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin:0 16px 12px}
    .ct{font-size:11px;letter-spacing:.09em;color:var(--gold);margin-bottom:10px;text-transform:uppercase;font-weight:bold}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:8px;font-size:13px;letter-spacing:.05em;cursor:pointer;border:none;transition:opacity .15s,transform .1s;min-height:48px;font-family:Georgia,serif;font-weight:bold;width:100%;text-align:center}
    .btn:active{opacity:.8;transform:scale(.98)}
    .btn-g{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a0a0a}
    .btn-o{background:transparent;border:1px solid var(--bdr);color:var(--parch)}
    .btn-d{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.4);color:var(--red)}
    .btn-sm{padding:8px 14px;font-size:12px;min-height:40px}
    .btn-row{display:flex;gap:10px;width:100%}
    .btn-row .btn{flex:1}
    .inp{background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;color:var(--text);font-family:Georgia,serif;font-size:16px;padding:13px 16px;width:100%;outline:none;transition:border-color .2s}
    .inp:focus{border-color:var(--gold)}
    .inp::placeholder{color:var(--dim)}
    .lbl{font-size:11px;letter-spacing:.08em;color:var(--parch);text-transform:uppercase;display:block;margin-bottom:6px}
    .field{margin-bottom:16px}
    textarea.inp{resize:none}
    .sh{padding:18px 16px 10px}
    .st{font-size:20px;color:var(--gold);font-weight:bold}
    .ss{font-size:14px;color:var(--parchDim);margin-top:3px;font-style:italic}
    #toast-wrap{position:fixed;bottom:calc(var(--bnav)+10px);left:50%;transform:translateX(-50%);z-index:999;width:calc(100%-32px);max-width:440px;pointer-events:none;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--bg3);border:1px solid var(--bdrBt);border-radius:8px;padding:11px 16px;font-size:13px;animation:slideUp .3s;color:var(--gold3);font-weight:bold}
    .toast.err{border-color:rgba(231,76,60,.6);color:var(--red);background:rgba(20,5,5,.95)}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:var(--bg2);border-top:1px solid var(--bdrBt);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:80dvh;display:flex;flex-direction:column;animation:shup .25s}
    @keyframes shup{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sh-handle{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:12px auto 0}
    .sh-head{padding:14px 16px;border-bottom:1px solid var(--bdr);font-size:14px;color:var(--gold);letter-spacing:.06em;font-weight:bold}
    .sh-body{overflow-y:auto;flex:1}
    .sh-body::-webkit-scrollbar{display:none}
    .sh-item{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid rgba(201,168,76,.07);font-size:15px}
    .sh-item:active{background:var(--goldDim)}
    .sh-item.sel{color:var(--gold)}
    .sh-foot{padding:12px 16px;border-top:1px solid var(--bdr)}
    .sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.07);font-size:14px}
    .sr:last-child{border-bottom:none}
    .sl{color:var(--parchDim)}
    .sv{color:var(--gold);font-weight:bold}
    .badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:bold;letter-spacing:.04em}
    .manual-badge{background:rgba(231,76,60,.2);color:var(--red);border:1px solid rgba(231,76,60,.4)}
    .tts-badge{background:rgba(39,174,96,.2);color:var(--destr);border:1px solid rgba(39,174,96,.4)}
    .draw-badge{background:rgba(201,168,76,.2);color:var(--gold);border:1px solid rgba(201,168,76,.4)}
    .tournament-badge{background:rgba(74,144,217,.2);color:var(--order);border:1px solid rgba(74,144,217,.4)}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;flex-wrap:wrap}
    .chips::-webkit-scrollbar{display:none}
    .chip{padding:6px 14px;border-radius:20px;font-size:11px;border:1px solid var(--bdr);color:var(--dim);cursor:pointer;white-space:nowrap;background:var(--bg2)}
    .chip.on{background:var(--goldDim);border-color:var(--gold);color:var(--gold)}
    .chip.disabled{opacity:.4;cursor:not-allowed}
    .htabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bdr);padding:0 16px}
    .htabs::-webkit-scrollbar{display:none}
    .htab{padding:10px 16px;font-size:11px;letter-spacing:.06em;color:var(--dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
    .htab.on{color:var(--gold);border-bottom-color:var(--gold)}
    .score-wrap{display:flex;gap:0;padding:8px 16px}
    .score-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
    .score-name{font-size:16px;letter-spacing:.05em;color:var(--parch);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;padding:0 4px;font-weight:bold}
    .score-total{font-size:44px;color:var(--gold);line-height:1;font-weight:bold}
    .score-round-total{font-size:14px;color:var(--parchDim);margin-top:-4px}
    .game-track-row{display:flex;align-items:center;gap:6px;padding:4px 0;width:100%}
    .game-track-label{font-size:10px;color:var(--parchDim);letter-spacing:.04em;text-transform:uppercase;width:48px;text-align:right;flex-shrink:0}
    .game-track-stepper{display:flex;align-items:center;gap:0}
    .game-track-btn{width:32px;height:32px;background:var(--bg3);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);font-size:16px;font-weight:bold;user-select:none;border-radius:6px}
    .game-track-btn:active{background:var(--goldDim)}
    .game-track-val{width:32px;height:32px;background:var(--bg2);border-top:1px solid var(--bdr);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:var(--text)}
    .game-track-full{flex:1;min-width:0}
    .underdog-badge{display:inline-block;background:var(--fury);color:#fff;font-size:8px;padding:2px 6px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase;margin-left:4px}
    .double-btn{background:var(--bg3);border:2px solid var(--bdr);color:var(--parch);font-size:10px;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:center;min-width:60px;letter-spacing:.04em;text-transform:uppercase;font-weight:bold;transition:all .15s}
    .double-btn:active{background:var(--goldDim);border-color:var(--gold)}
    .double-btn.active{background:var(--goldDim);border-color:var(--gold);color:var(--gold)}
    .tactic-section{margin:6px 0;width:100%}
    .tactic-header-row{font-size:10px;color:var(--parchDim);letter-spacing:.04em;text-transform:uppercase;text-align:center;margin-bottom:6px}
    .tactic-item{display:flex;align-items:center;gap:8px;padding:10px 10px;font-size:12px;margin:3px 0;border-radius:6px;color:var(--dim);cursor:pointer;transition:all .15s;min-height:44px}
    .tactic-item:active{background:rgba(201,168,76,.1)}
    .tactic-item.done{color:var(--gold);cursor:pointer}
    .tactic-item.current{border:1px solid var(--gold);color:var(--parch);background:var(--goldDim);cursor:pointer}
    .tactic-item.locked{opacity:.4;cursor:not-allowed}
    .tactic-item .tac-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center}
    .tactic-item.done .tac-dot{background:var(--gold);border-color:var(--gold)}
    .tactic-item.done .tac-dot::after{content:'✓';color:#0a0a0a;font-size:10px;font-weight:bold}
    .tactic-item.current .tac-dot{border-color:var(--gold)}
    .tactic-item.locked .tac-dot{border-color:var(--dim)}
    .tactic-item .tac-plus{font-size:10px;color:var(--gold);font-weight:bold;margin-left:auto;flex-shrink:0}
    .landing-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin:0 16px 10px}
    .landing-card .game-summary{font-size:13px;font-weight:bold;margin-bottom:4px}
    .landing-card .game-meta{font-size:11px;color:var(--dim)}
    .landing-actions{display:flex;gap:8px;margin-top:10px}
    .landing-actions .btn{flex:1;font-size:11px;padding:10px;min-height:40px}
    .login-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px max(env(safe-area-inset-bottom,0px),24px);background:radial-gradient(ellipse at 50% 25%,rgba(201,168,76,.08) 0%,transparent 65%)}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-title{font-size:24px;color:var(--gold);font-weight:bold;line-height:1.3}
    .login-sub{font-size:14px;color:var(--parchDim);margin-top:6px;font-style:italic}
    .login-box{background:rgba(10,10,10,.95);border:1px solid var(--bdr);border-radius:16px;padding:22px}
    .divider{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--dim);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
    .err-msg{color:var(--red);font-size:13px;margin-bottom:12px;padding:10px 12px;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.35);border-radius:8px;display:flex;align-items:center;gap:8px}
    .warn{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.4);border-radius:8px;padding:11px 14px;margin:0 16px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#e88;line-height:1.4}
    .susp{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.35);color:var(--red);padding:2px 7px;border-radius:4px;font-size:10px}
    .adm-head{background:linear-gradient(135deg,#1a1000,#0d0d0d);border-bottom:1px solid var(--gold2);padding:18px 16px 12px}
    .adm-title{font-size:15px;color:var(--gold2);font-weight:bold}
    .round-dots{display:flex;gap:4px;justify-content:center;margin:6px 0}
    .rdot{width:30px;height:4px;border-radius:2px;background:var(--bg4)}
    .rdot.on{background:var(--gold)}
    .chart-wrap{width:100%;overflow-x:auto}
    .game-card{cursor:pointer}
    .gvs{font-size:13px;font-weight:bold}
    .gscore{font-size:22px;color:var(--gold);font-weight:bold}
    .faction-check{width:20px;height:20px;border:2px solid var(--bdr);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .faction-check.checked{background:var(--gold);border-color:var(--gold)}
    .faction-check.checked::after{content:'✓';color:#0a0a0a;font-size:13px;font-weight:bold}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--dim);background:none;border:none;padding:4px;z-index:5}
    .pw-toggle:hover{color:var(--gold)}
    .sort-row{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;justify-content:center}
    .sort-chip{padding:5px 12px;border-radius:16px;font-size:10px;letter-spacing:.05em;border:1px solid var(--bdr);color:var(--dim);cursor:pointer;background:var(--bg2);text-transform:uppercase}
    .sort-chip.on{background:var(--goldDim);border-color:var(--gold);color:var(--gold)}
    .user-banner{text-align:center;padding:0 16px 4px;font-size:20px;color:var(--gold);font-weight:bold;letter-spacing:.06em}
    .user-banner-sub{text-align:center;font-size:12px;color:var(--parchDim);margin-bottom:4px;font-style:italic}
    .stats-toggle{display:flex;gap:8px;padding:8px 0}
    .stats-toggle-btn{flex:1;padding:8px;border-radius:20px;font-size:11px;border:1px solid var(--bdr);color:var(--dim);cursor:pointer;text-align:center;background:var(--bg2);letter-spacing:.05em;text-transform:uppercase}
    .stats-toggle-btn.on{background:var(--goldDim);border-color:var(--gold);color:var(--gold)}
    .dash-summary{display:flex;gap:8px;padding:0 0 12px}
    .dash-summary-item{flex:1;text-align:center;padding:10px 6px;background:var(--bg3);border-radius:8px;border:1px solid var(--bdr)}
    .dash-summary-val{font-size:20px;color:var(--gold);font-weight:bold}
    .dash-summary-lbl{font-size:9px;color:var(--parchDim);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
    .fury-color{color:var(--fury)}
    .rage-color{color:var(--rage)}
    .cp-color{color:var(--cp)}
    select.tac-select{background:var(--bg3);color:var(--text);border:1px solid var(--bdr);border-radius:8px;font-family:Georgia,serif;font-size:13px;padding:10px 12px;width:100%;min-height:42px}
    select.tac-select:focus{border-color:var(--gold);outline:none}
    select.tac-select option:disabled{color:var(--dim);font-style:italic}
    .tactic-container{display:flex;flex-direction:column;gap:6px;width:100%;min-height:120px}
    .tactic-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:8px 10px;flex:1;min-height:110px;display:flex;flex-direction:column}
    .tactic-card .tac-name{font-size:11px;color:var(--parch);font-weight:bold;margin-bottom:4px;letter-spacing:.04em}
    .tactic-card .tac-sub{font-size:11px;color:var(--dim);padding:3px 0 3px 16px;display:flex;align-items:center;gap:6px}
    .tactic-card .tac-sub.done{color:var(--gold)}
    .tactic-card .tac-sub.current{color:var(--parch);border-left:2px solid var(--gold);padding-left:14px}
    .tactic-card .tac-sub.locked{opacity:.4}
    .tactic-card .tac-sub .tac-dot-sm{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid var(--bdr);display:inline-flex;align-items:center;justify-content:center}
    .tactic-card .tac-sub.done .tac-dot-sm{background:var(--gold);border-color:var(--gold)}
    .tactic-card .tac-sub.done .tac-dot-sm::after{content:'✓';color:#0a0a0a;font-size:8px;font-weight:bold}
    .tactic-card .tac-sub.current .tac-dot-sm{border-color:var(--gold)}
    .tactic-card .tac-sub.locked .tac-dot-sm{border-color:var(--dim)}
    .tactic-card .tac-sub .tac-plus-sm{font-size:9px;color:var(--gold);font-weight:bold;margin-left:auto;flex-shrink:0}
    .resource-block{width:100%;margin-top:4px;padding-top:6px;border-top:1px solid var(--bdr)}
    .resource-block .game-track-row .game-track-label{color:var(--parchDim)}
    .resource-block .game-track-row .game-track-val{color:var(--text)}
    .resource-block .game-track-row .game-track-btn{color:var(--gold)}
    .faction-tracker-block{width:100%;margin-top:2px;padding:6px 8px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg3);min-height:70px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;flex:1}
    .faction-tracker-block .tracker-label{font-size:9px;letter-spacing:.04em;text-transform:uppercase;font-weight:bold;text-align:center;margin-bottom:4px}
    .faction-tracker-block .ft-row{display:flex;align-items:center;gap:4px;padding:2px 0;width:100%;flex-wrap:wrap}
    .faction-tracker-block .ft-row .ft-label{font-size:9px;color:var(--parchDim);letter-spacing:.04em;text-transform:uppercase;flex-shrink:0;min-width:30px}
    .faction-tracker-block .ft-row .ft-btn{width:22px;height:22px;background:var(--bg3);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);font-size:12px;font-weight:bold;user-select:none;border-radius:3px}
    .faction-tracker-block .ft-row .ft-btn:active{background:var(--goldDim)}
    .faction-tracker-block .ft-row .ft-val{width:24px;height:22px;background:var(--bg2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:var(--gold);border-radius:3px}
    .faction-tracker-block .bm-desc{font-size:9px;color:var(--parchDim);font-style:italic;padding:2px 0 0 2px;line-height:1.4}
    .tracker-flex-container{display:flex;gap:8px;width:100%;align-items:stretch;margin-top:2px}
    .tracker-flex-container .faction-tracker-block{flex:1;margin-top:0}
    .check-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .check-row label{font-size:12px;color:var(--parch);display:flex;align-items:center;gap:6px;cursor:pointer}
    .check-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
    .tts-note{font-size:10px;color:var(--parchDim);font-style:italic;margin-top:2px;padding-left:26px}
    .stats-data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .stats-data-grid .stat-item{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:10px 8px;text-align:center}
    .stats-data-grid .stat-item .stat-val{font-size:20px;color:var(--gold);font-weight:bold}
    .stats-data-grid .stat-item .stat-lbl{font-size:9px;color:var(--parchDim);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
    .ft-check{display:inline-block;padding:4px 8px;font-size:10px;border:1px solid var(--bdr);border-radius:4px;cursor:pointer;background:var(--bg3);transition:all .15s;user-select:none}
    .ft-check.used{background:var(--goldDim);border-color:var(--gold);color:var(--gold)}
    .ft-check .ft-dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--dim);margin-right:4px}
    .ft-check.used .ft-dot{background:var(--gold);border-color:var(--gold)}
    .ft-check.disabled{opacity:0.4;cursor:not-allowed}
    .khorne-tree .khorne-ability{padding:4px 8px;margin:4px 0;border-radius:4px;font-size:11px;transition:all .15s;cursor:default}
    .khorne-tree .khorne-ability.unlocked{background:var(--goldDim);border:2px solid var(--gold);color:var(--gold);font-weight:bold}
    .khorne-tree .khorne-ability.available{background:var(--bg3);border:1px solid var(--bdr);color:var(--parch);cursor:pointer}
    .khorne-tree .khorne-ability.available:hover{background:var(--goldDim);border-color:var(--gold)}
    .khorne-tree .khorne-ability.locked{background:var(--bg3);border:1px solid var(--bdr);color:var(--dim);opacity:.4;cursor:not-allowed}
    .khorne-tree .khorne-ability .khorne-status{font-size:8px;color:var(--parchDim);margin-left:6px}

      modifyGameOpen: false, modifyGameId: null, modifyVP1: '', modifyVP2: '', modifyWinner: '', modifyNotes: '', modifyTTS: false, modifyTournament: false,
      draftExists: false, activeBattleNoticeShown: false,
      loading: true
    },
    profile: { name: '', factions: [], init: false, curPw: '', newPw: '', conf: '', delConf: '', showDel: false },
    admin: { tab: 0, expandedUser: null, resetTarget: null, resetPw: '', editTarget: null, editName: '', confDel: null, delInput: '', confDelGameId: null, newPw: '', confPw: '', name: '', nameInit: false, exportUser: 'all' },
    _allUsers: {},
    _allGames: []
  };

  // Make S globally accessible so oninput can update it
  window.S = S;

  const DataCache = {
    get users() { return S._allUsers; },
    get games() { return S._allGames; },
    user(un) { return this.users[un] || null; },
    invalidate() { /* no-op */ }
  };

  // ─── ACTIONS ────────────────────────────────────────────────────────
  const Actions = {
    goToTab: function(i) {
      if (i === 1 && S.battle.step !== 0) {
        if (!S.ui.activeBattleNoticeShown) {
          toast('Cannot start a new record while one is in progress. Return to Home.', false);
          S.ui.activeBattleNoticeShown = true;
          setTimeout(() => { S.ui.activeBattleNoticeShown = false; }, 4000);
        }
        S.nav.tab = 0;
        S.nav.currentScreen = null;
        render(true);
        return;
      }
      S.nav.tab = i;
      if (i === 1 && S.auth.session) {
        const f = DataCache.user(S.auth.session.username);
        if (f) { S.auth.session = f; S.profile.name = f.displayName || f.username; S.profile.factions = [...f.factions]; }
      }
      if (!S.profile.init && S.auth.session) {
        S.profile.name = S.auth.session.displayName || S.auth.session.username;
        S.profile.factions = [...S.auth.session.factions];
        S.profile.init = true;
      }
      if (i === 1 && !S.battle.faction1 && S.auth.session && S.auth.session.factions && S.auth.session.factions.length > 0) {
        S.battle.faction1 = S.auth.session.factions[0];
      }
      S.nav.currentScreen = null;
      if (i === 1 && S.battle.step === 0) { S.battle.firstEntry = true; render(true, 0); } else { render(true); }
    },

    switchLoginMode: function() {
      S.auth.loginMode = S.auth.loginMode === 'login' ? 'register' : 'login';
      S.auth.loginError = '';
      S.register.error = '';
      S.nav.currentScreen = null;
      render(true);
    },

    login: async function() {
      const username = getInputValue('auth.loginUser') || S.auth.loginUser;
      const password = getInputValue('auth.loginPw') || S.auth.loginPw;
      if (!username || !password) { S.auth.loginError = 'Please enter username and password.'; render(true); return; }
      try {
        const user = await signIn(username, password);
        const profile = await loadProfile(username);
        if (profile) {
          const session = {
            username: profile.username,
            displayName: profile.display_name,
            factions: profile.factions || [],
            isAdmin: profile.is_admin,
            isSuspended: profile.is_suspended,
            joinedAt: profile.joined_at,
            gamesPlayed: profile.games_played,
            wins: profile.wins,
            draws: profile.draws,
          };
          S.auth.session = session;
          S.auth.loginPw = '';
          S.auth.loginError = '';
          if (!S.admin.nameInit) { S.admin.name = session.displayName || session.username; S.admin.nameInit = true; }
          S.profile.name = session.displayName || session.username;
          S.profile.factions = [...session.factions];
          S.profile.init = true;
          if (!S.battle.faction1 && session.factions && session.factions.length > 0) S.battle.faction1 = session.factions[0];
          await loadAllData();
          S.ui.loading = false;
          S.nav.currentScreen = null;
          render(true);
        } else {
          S.auth.loginError = 'Profile not found.';
          render(true);
        }
      } catch (e) {
        S.auth.loginError = e.message || 'Login failed.';
        render(true);
      }
    },

    register: async function() {
  const username = getInputValue('register.user') || S.register.user;
  const password = getInputValue('register.pw') || S.register.pw;
  const confirm = getInputValue('register.conf') || S.register.conf;
  if (!username) { S.register.error = 'Username required.'; render(true); return; }
  if (!password || password.length < 6) { S.register.error = 'Password must be at least 6 characters.'; render(true); return; }
  if (password !== confirm) { S.register.error = "Passwords don't match."; render(true); return; }
  try {
    await signUp(username, password, {
      displayName: username,
      factions: S.register.factions || []
    });
    // Sign out to return to the login screen
    await signOut();
    S.auth.session = null;
    S.register.user = '';
    S.register.pw = '';
    S.register.conf = '';
    S.register.factions = [];
    S.register.error = '';
    S.auth.loginMode = 'login';
    toast('Account created! Please log in.');
    render(true);
  } catch (e) {
    S.register.error = e.message || 'Registration failed. Please try a different username.';
    render(true);
  }
},

    logout: async function() {
      await signOut();
      S.auth.session = null;
      S.nav.tab = 0;
      S.auth.loginPw = '';
      S.auth.loginError = '';
      S.admin.nameInit = false;

    },

    closeModifyGame: function() { S.ui.modifyGameOpen = false; S.ui.modifyGameId = null; render(true); },

    openManualEntry: function() {
      S.landing.manualOpen = true;
      S.landing.manualVP1 = '';
      S.landing.manualVP2 = '';
      S.landing.manualWinner = '';
      S.landing.manualNotes = '';
      S.landing.manualF1 = S.battle.faction1 || '';
      S.landing.manualF2 = '';
      S.landing.manualOpp = '';
      S.landing.manualScen = '';
      S.landing.manualTTS = false;
      S.landing.manualTournament = false;
      S.landing.manualP1Tactics = [-1,-1];
      S.landing.manualP2Tactics = [-1,-1];
      render(true);
    },
    closeManualEntry: function() { S.landing.manualOpen = false; render(true); },

    saveManualGame: async function() {
      const vp1 = parseInt(getInputValue('landing.manualVP1') || S.landing.manualVP1) || 0;
      const vp2 = parseInt(getInputValue('landing.manualVP2') || S.landing.manualVP2) || 0;
      const winner = getInputValue('landing.manualWinner') || S.landing.manualWinner;
      const oppName = getInputValue('landing.manualOpp') || S.landing.manualOpp || 'Guest Player';
      const scenario = getInputValue('landing.manualScen') || S.landing.manualScen;
      const notes = getInputValue('landing.manualNotes') || S.landing.manualNotes;
      const f1 = getInputValue('landing.manualF1') || S.landing.manualF1 || 'Unknown';
      const f2 = getInputValue('landing.manualF2') || S.landing.manualF2 || 'Unknown';
      const tts = S.landing.manualTTS;
      const tourn = S.landing.manualTournament;
      if (!winner) { toast('Select a winner.', true); return; }
      const key = 'g' + Date.now();
      const oppUser = CONFIG.SPECIAL_USERS.GUEST;
      let winnerVal;
      if (winner === 'draw') winnerVal = 'draw';
      else winnerVal = winner === S.auth.session.username ? S.auth.session.username : oppUser;
      const p1Tactics = S.landing.manualP1Tactics.filter(t => t >= 0).map(t => CONFIG.BATTLE_TACTICS[t].name);
      const p2Tactics = S.landing.manualP2Tactics.filter(t => t >= 0).map(t => CONFIG.BATTLE_TACTICS[t].name);
      const game = {
        id: key,
        date: new Date().toISOString().slice(0,10),
        player1: S.auth.session.username,
        player2: oppUser,
        faction1: f1,
        faction2: f2,
        grandAlliance1: gaFor(f1),
        grandAlliance2: gaFor(f2),
        rounds: [],
        totalVP1: vp1,
        totalVP2: vp2,
        winner: winnerVal,
        scenario: scenario,
        notes: notes,
        loggedBy: S.auth.session.username,
        isSample: false,
        guestName: oppName,
        manuallyEntered: true,
        isTTS: tts,
        isTournament: tourn || false,
        displayName1: S.auth.session.displayName || S.auth.session.username,
        displayName2: oppName,
        p1TacticsUsed: p1Tactics,
        p2TacticsUsed: p2Tactics
      };
      await saveGame(game);
      await loadAllData();
      const user = DataCache.user(S.auth.session.username);
      if (user) {
        S.auth.session.gamesPlayed = user.gamesPlayed;
        S.auth.session.wins = user.wins;
        S.auth.session.draws = user.draws;
      }
      toast('Game recorded!');
      S.landing.manualOpen = false;
      render(true);
    },

    openManualOpponentSheet: function() { S.landing.opponentSheetOpen = true; S.landing.guestOpen = false; render(true); },
    closeManualOpponentSheet: function() { S.landing.opponentSheetOpen = false; S.landing.guestOpen = false; render(true); },
    selectManualOpponent: function(username, displayName) { S.landing.manualOpp = displayName || username; S.landing.opponentSheetOpen = false; S.landing.guestOpen = false; render(true); },
    openManualGuestInput: function() { S.landing.guestOpen = true; render(true); },
    confirmManualGuest: function() { const n = S.landing.guestInput.trim() || 'Guest Player'; S.landing.manualOpp = n; S.landing.opponentSheetOpen = false; S.landing.guestOpen = false; S.landing.guestInput = ''; render(true); },
    cancelManualGuest: function() { S.landing.guestOpen = false; S.landing.guestInput = ''; render(true); },

    openFactionPicker: function(ctx) {
      S.ui.factionPickerFor = ctx;
      render(true);
    },
    closeFactionPicker: function() { S.ui.factionPickerFor = null; render(true); },

    pickFaction: function(ctx, f) {
      if (ctx === 'f1') {
        S.battle.faction1 = S.battle.faction1 === f ? '' : f;
      } else if (ctx === 'f2') {
        S.battle.faction2 = S.battle.faction2 === f ? '' : f;
      } else if (ctx === 'reg') {
        S.register.factions = S.register.factions.includes(f) ? S.register.factions.filter(x => x !== f) : [...S.register.factions, f];
        render(true);
        return;
      } else if (ctx === 'prof') {
        S.profile.factions = S.profile.factions.includes(f) ? S.profile.factions.filter(x => x !== f) : [...S.profile.factions, f];
        render(true);
        return;
      }

      S.ui.factionPickerFor = null;
      saveDraftDebounced();

      const btn = document.getElementById('faction-btn-' + ctx);
      if (btn) {
        const factionName = ctx === 'f1' ? S.battle.faction1 : S.battle.faction2;
        btn.textContent = factionName || 'Select faction…';
      }

      const overlay = document.querySelector('.overlay');
      if (overlay) overlay.remove();
    },

    clearFactionPick: function(ctx) {
      if (ctx === 'f1') S.battle.faction1 = '';
      else if (ctx === 'f2') S.battle.faction2 = '';
      render(true);
    },

    setTactic: function(player, slot, tacticIdx) {
      const arr = player === 'p1' ? S.battle.p1Tactics : S.battle.p2Tactics;
      const val = parseInt(tacticIdx);
      if (val < 0) { arr[slot] = -1; } else { const os = slot === 0 ? 1 : 0; if (arr[os] === val) { toast('Already selected in other slot', true); return; } arr[slot] = val; }
      S.battle.setupError = '';
      saveDraftDebounced();
      render(true);
    },

    setManualTactic: function(player, slot, value) {
      const val = parseInt(value);
      const arr = player === 'p1' ? S.landing.manualP1Tactics : S.landing.manualP2Tactics;
      const otherSlot = slot === 0 ? 1 : 0;
      if (arr[otherSlot] === val && val >= 0) { toast('Tactic already selected in other slot.', true); render(true); return; }
      arr[slot] = val;
      render(true);
    },

    openOpponentSheet: function() { S.battle.opponentSheetOpen = true; S.battle.guestOpen = false; render(true); },
    closeOpponentSheet: function() { S.battle.opponentSheetOpen = false; S.battle.guestOpen = false; render(true); },

    selectOpponent: function(username, displayName, factions) {
      if (typeof factions === 'string') { try { factions = JSON.parse(factions); } catch (e) { factions = []; } }
      if (!Array.isArray(factions)) factions = [];
      const dn = username === CONFIG.SPECIAL_USERS.GUEST ? (S.battle.guestInput.trim() || 'Guest Player') : (displayName || username);
      S.battle.opponent = { username, displayName: dn, factions };
      S.battle.opponentSheetOpen = false;
      S.battle.guestOpen = false;
      S.battle.guestInput = '';
      S.battle.setupError = '';
      if (username !== CONFIG.SPECIAL_USERS.ANCIENT && username !== CONFIG.SPECIAL_USERS.GUEST) {
        const ou = DataCache.user(username);
        if (ou && ou.factions && ou.factions.length > 0) { S.battle.faction2 = ou.factions[0]; }
        else if (factions && factions.length) { S.battle.faction2 = factions[0]; }
      } else if (factions && factions.length) { S.battle.faction2 = factions[0]; }
      saveDraftDebounced();
      render(true);
    },

    openGuestInput: function() { S.battle.guestOpen = true; render(true); },
    cancelGuestInput: function() { S.battle.guestOpen = false; S.battle.guestInput = ''; render(true); },

    confirmGuest: function() {
      const n = S.battle.guestInput.trim() || 'Guest Player';
      S.battle.opponent = { username: CONFIG.SPECIAL_USERS.GUEST, displayName: n, factions: [] };
      S.battle.opponentSheetOpen = false;
      S.battle.guestOpen = false;
      S.battle.guestInput = '';
      S.battle.setupError = '';
      saveDraftDebounced();
      render(true);
    },

    startBattle: function() {
      const errors = [];
      if (!S.battle.faction1) errors.push('Select your faction');
      if (!S.battle.opponent) errors.push('Select an opponent');
      if (!S.battle.faction2) errors.push("Select opponent's faction");
      const p1v = S.battle.p1Tactics.filter(t => t >= 0).length;
      const p2v = S.battle.p2Tactics.filter(t => t >= 0).length;
      if (p1v < 2) errors.push('Select 2 battle tactics for yourself');
      if (p2v < 2) errors.push('Select 2 battle tactics for opponent');
      if (!S.battle.scenario) errors.push('Select a battle plan');
      if (errors.length > 0) { S.battle.setupError = errors.join('. ') + '.'; render(true); return; }
      clearDraft();
      S.battle.step = 1;
      S.battle.rounds = [defaultRound()];
      S.battle.currentRound = 0;
      S.battle.winner = null;
      S.battle.tacticProgress = {};
      S.battle._cumulative = null;
      S.battle._underdogCache = null;
      S.battle.underdog = null;
      S.battle.doubleTurn = null;
      S.battle.manualUnderdog = false;
      S.battle.resources = { p1fury:0, p1rage:0, p1cp: CONFIG.STARTING_CP, p2fury:0, p2rage:0, p2cp: CONFIG.STARTING_CP };
      S.battle.khorne = { p1: { points:0, unlocked:[] }, p2: { points:0, unlocked:[] } };
      S.battle.lumineth = { p1: { scripture: { strength:0, river:0, wind:0, mountain:0 }, extraRune: false, extraUsed: false }, p2: { scripture: { strength:0, river:0, wind:0, mountain:0 }, extraRune: false, extraUsed: false } };
      S.battle.tideState = { p1: { track: null, step: 0 }, p2: { track: null, step: 0 } };
      S.battle._prevTideState = { p1: { track: null, step: 0 }, p2: { track: null, step: 0 } };
      saveDraftDebounced();
      render(true, 0);
    },

    toggleTacticSub: function(player, tacticIdx, subIdx) {
      if (S.battle.doubleTurn === player) { toast('Cannot score battle tactics after taking the double turn!', true); return; }
      const rk = S.battle.currentRound;
      if (!S.battle.tacticProgress[rk]) S.battle.tacticProgress[rk] = { p1: {}, p2: {} };
      const prog = S.battle.tacticProgress[rk][player];
      if (TacticManager.canDeselectSub(player, tacticIdx, subIdx, rk)) {
        prog[tacticIdx] = subIdx - 1;
        if (prog[tacticIdx] < 0) delete prog[tacticIdx];
        if (player === 'p1') S.battle.rounds[S.battle.currentRound].t1 = Math.max(0, (S.battle.rounds[S.battle.currentRound].t1 || 0) - 5);
        else S.battle.rounds[S.battle.currentRound].t2 = Math.max(0, (S.battle.rounds[S.battle.currentRound].t2 || 0) - 5);
      } else if (TacticManager.canSelectSub(player, tacticIdx, subIdx, rk)) {
        prog[tacticIdx] = subIdx;
        if (player === 'p1') S.battle.rounds[S.battle.currentRound].t1 = (S.battle.rounds[S.battle.currentRound].t1 || 0) + 5;
        else S.battle.rounds[S.battle.currentRound].t2 = (S.battle.rounds[S.battle.currentRound].t2 || 0) + 5;
      } else {
        toast('Cannot score or deselect this sub now.', true);
        return;
      }
      const rd = S.battle.rounds[S.battle.currentRound];
      rd.vp1 = (rd.p1 || 0) + (rd.t1 || 0);
      rd.vp2 = (rd.p2 || 0) + (rd.t2 || 0);
      S.battle.rounds = [...S.battle.rounds];
      S.battle._cumulative = null;
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    adjResourceDOM: function(bind, delta, minVal, maxVal) {
      S.battle.resources[bind] = Math.max(minVal, Math.min(maxVal, (S.battle.resources[bind] || 0) + delta));
      if (bind === 'p1fury' || bind === 'p2fury') S.battle.resources[bind] = Math.min(CONFIG.FURY_MAX, S.battle.resources[bind]);
      const el = document.getElementById('res-' + bind);
      if (el) el.textContent = S.battle.resources[bind];
      saveDraftDebounced();
    },

    adjStepperDOM: debounce(function(bind, delta, maxVal) {
      const keys = bind.split('.');
      let obj = S;
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      const key = keys[keys.length - 1];
      const rd = S.battle.rounds[S.battle.currentRound];
      rd[key] = Math.min(maxVal, Math.max(0, (rd[key] || 0) + delta));
      rd.vp1 = (rd.p1 || 0) + (rd.t1 || 0);
      rd.vp2 = (rd.p2 || 0) + (rd.t2 || 0);
      S.battle.rounds = [...S.battle.rounds];
      S.battle._cumulative = null;
      const el = document.getElementById('vp-' + bind.replace(/\./g, '-'));
      if (el) el.textContent = rd[key];
      let cv1 = 0, cv2 = 0;
      for (let i = 0; i <= S.battle.currentRound; i++) { cv1 += S.battle.rounds[i].vp1 || 0; cv2 += S.battle.rounds[i].vp2 || 0; }
      const rv1 = (rd.p1 || 0) + (rd.t1 || 0), rv2 = (rd.p2 || 0) + (rd.t2 || 0);
      const rte = document.querySelectorAll('.score-round-total');
      if (rte[0]) rte[0].textContent = '+' + rv1 + ' this round';
      if (rte[1]) rte[1].textContent = '+' + rv2 + ' this round';
      const ste1 = document.getElementById('score-total-p1');
      const ste2 = document.getElementById('score-total-p2');
      if (ste1) ste1.textContent = cv1;
      if (ste2) ste2.textContent = cv2;
      const rt = document.getElementById('running-total');
      if (rt) rt.innerHTML = '<span style="color:var(--gold);font-weight:bold">Total</span><span style="font-size:18px;font-weight:bold;color:var(--gold)">' + cv1 + ' — ' + cv2 + '</span>';
      saveDraftDebounced();
    }, 50),

    takeDouble: function(player) {
      if (S.battle.doubleTurn === player) { S.battle.doubleTurn = null; S.battle.manualUnderdog = false; Actions.recheckUnderdog(); }
      else { S.battle.doubleTurn = player; S.battle.underdog = player === 'p1' ? 'p2' : 'p1'; S.battle.manualUnderdog = true; }
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    clearDouble: function() { S.battle.doubleTurn = null; S.battle.manualUnderdog = false; Actions.recheckUnderdog(); saveDraftDebounced(); renderPreservingScroll(true); },

    recheckUnderdog: function() {
      if (S.battle.manualUnderdog) return;
      const rk = S.battle.currentRound;
      if (S.battle._underdogCache && S.battle._underdogCache.round === rk) { S.battle.underdog = S.battle._underdogCache.underdog; return; }
      let cv1 = 0, cv2 = 0;
      for (let i = 0; i < rk; i++) { cv1 += S.battle.rounds[i].vp1 || 0; cv2 += S.battle.rounds[i].vp2 || 0; }
      let underdog = null;
      if (rk === 0) underdog = null;
      else if (cv1 < cv2) underdog = 'p1';
      else if (cv2 < cv1) underdog = 'p2';
      else underdog = null;
      S.battle.underdog = underdog;
      S.battle._underdogCache = { round: rk, underdog };
      S.battle.resources.p1cp = underdog === 'p1' ? CONFIG.UNDERDOG_CP : CONFIG.STARTING_CP;
      S.battle.resources.p2cp = underdog === 'p2' ? CONFIG.UNDERDOG_CP : CONFIG.STARTING_CP;
    },

    applyRoundStartResources: function() {
      if (!S.battle.manualUnderdog) Actions.recheckUnderdog();
      S.battle.resources.p1cp = S.battle.underdog === 'p1' ? CONFIG.UNDERDOG_CP : CONFIG.STARTING_CP;
      S.battle.resources.p2cp = S.battle.underdog === 'p2' ? CONFIG.UNDERDOG_CP : CONFIG.STARTING_CP;
      S.battle.resources.p1rage = S.battle.resources.p1fury || 0;
      S.battle.resources.p2rage = S.battle.resources.p2fury || 0;
    },

    nextRound: function() {
      if (S.battle.currentRound < CONFIG.MAX_ROUNDS - 1) {
        S.battle._prevTideState.p1 = { ...S.battle.tideState.p1 };
        S.battle._prevTideState.p2 = { ...S.battle.tideState.p2 };
        const prevRound = S.battle.rounds[S.battle.currentRound];
        S.battle.rounds.push(defaultRound());
        S.battle.currentRound++;
        const newRound = S.battle.rounds[S.battle.currentRound];
        const tracker1 = getTracker(S.battle.faction1);
        const tracker2 = getTracker(S.battle.faction2);
        if (tracker1 && tracker1.persist) {
          const prevFT = prevRound.p1ft || {};
          const newFT = newRound.p1ft || {};
          if (prevFT.value !== undefined) newFT.value = prevFT.value;
          if (prevFT.used) newFT.used = [...prevFT.used];
          if (prevFT.active) newFT.active = prevFT.active;
          if (prevFT.step !== undefined) newFT.step = prevFT.step;
          if (prevFT.track) newFT.track = prevFT.track;
          if (prevFT.activeBlessings) newFT.activeBlessings = [...prevFT.activeBlessings];
          newFT.addedThisRound = [];
        }
        if (tracker2 && tracker2.persist) {
          const prevFT = prevRound.p2ft || {};
          const newFT = newRound.p2ft || {};
          if (prevFT.value !== undefined) newFT.value = prevFT.value;
          if (prevFT.used) newFT.used = [...prevFT.used];
          if (prevFT.active) newFT.active = prevFT.active;
          if (prevFT.step !== undefined) newFT.step = prevFT.step;
          if (prevFT.track) newFT.track = prevFT.track;
          if (prevFT.activeBlessings) newFT.activeBlessings = [...prevFT.activeBlessings];
          newFT.addedThisRound = [];
        }
        if (tracker1 && tracker1.type === 'delusions' && prevRound.p1ft) {
          newRound.p1ft.previous = prevRound.p1ft.value || 0;
          newRound.p1ft.value = prevRound.p1ft.value || 0;
        }
        if (tracker2 && tracker2.type === 'delusions' && prevRound.p2ft) {
          newRound.p2ft.previous = prevRound.p2ft.value || 0;
          newRound.p2ft.value = prevRound.p2ft.value || 0;
        }
        Actions.applyRoundStartResources();
        S.battle._cumulative = null;
        S.battle._underdogCache = null;
        saveDraftDebounced();
        render(true, 0);
      }
    },

    adjFTStepper: function(player, delta, minVal, maxVal) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { value: 0, active: null };
      if (typeof rd[p] !== 'object' || rd[p] === null) { const val = typeof rd[p] === 'number' ? rd[p] : 0; rd[p] = { value: val, active: null }; }
      rd[p].value = Math.min(maxVal, Math.max(minVal, (rd[p].value || 0) + delta));
      S.battle.rounds = [...S.battle.rounds];
      const el = document.getElementById('ft-val-' + player);
      if (el) el.textContent = rd[p].value;
      const rangeEl = document.getElementById('ft-range-' + player);
      if (rangeEl) { const newVal = rd[p].value; const range = getSylvanethRange(newVal); rangeEl.innerHTML = 'Creeping Overgrowth Range: <strong>' + range + '</strong>'; }
      saveDraftDebounced();
    },

    setFTBadMoon: function(player, face) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { active: null };
      if (typeof rd[p] !== 'object' || rd[p] === null) rd[p] = { value: 0, active: null };
      rd[p].value = parseInt(face);
      S.battle.rounds = [...S.battle.rounds];
      const el = document.getElementById('ft-bm-' + player);
      if (el) el.value = face;
      const desc = document.getElementById('ft-bm-desc-' + player);
      if (desc) desc.textContent = CONFIG.BAD_MOON_DESCS[parseInt(face)] || '';
      saveDraftDebounced();
    },

    toggleFTDirtyTrick: function(player, idx) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { active: null, used: [], value: 0, resetUsed: false };
      if (typeof rd[p] !== 'object' || rd[p] === null) rd[p] = { value: 0, active: null, used: [], resetUsed: false };
      if (!rd[p].used) rd[p].used = [];
      if (rd[p].used.indexOf(idx) > -1) {
        rd[p].used = rd[p].used.filter(i => i !== idx);
        rd[p].value = Math.max(0, (rd[p].value || 0) - 1);
      } else {
        rd[p].used.push(idx);
        rd[p].value = (rd[p].value || 0) + 1;
      }
      S.battle.rounds = [...S.battle.rounds];
      const el = document.getElementById('ft-dt-' + player + '-' + idx);
      if (el) el.classList.toggle('used');
      const valEl = document.getElementById('ft-val-' + player);
      if (valEl) valEl.textContent = rd[p].value;
      saveDraftDebounced();
    },

    resetFTDirtyTricks: function(player) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { used: [], value: 0, resetUsed: false };
      if (rd[p].resetUsed) { toast('End turn already used this round.', true); return; }
      rd[p].used = [];
      rd[p].resetUsed = true;
      S.battle.rounds = [...S.battle.rounds];
      CONFIG.DIRTY_TRICKS_LIST.forEach((_, i) => { const el = document.getElementById('ft-dt-' + player + '-' + i); if (el) el.classList.remove('used'); });
      const valEl = document.getElementById('ft-val-' + player);
      if (valEl) valEl.textContent = rd[p].value;
      const resetBtn = document.getElementById('ft-reset-' + player);
      if (resetBtn) resetBtn.disabled = true;
      toast('End turn applied – checkboxes cleared, count preserved.');
      saveDraftDebounced();
    },

    setFTDelusion: function(player, val) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { active: null, value: 0, previous: 0 };
      if (typeof rd[p] !== 'object' || rd[p] === null) rd[p] = { value: 0, previous: 0 };
      rd[p].previous = rd[p].value || 0;
      rd[p].value = parseInt(val);
      S.battle.rounds = [...S.battle.rounds];
      const el = document.getElementById('ft-del-' + player);
      if (el) el.value = val;
      saveDraftDebounced();
    },

    advanceBadMoon: function(player) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { active: null, value: 0 };
      if (typeof rd[p] !== 'object' || rd[p] === null) rd[p] = { value: 0, active: null };
      const faces = CONFIG.BAD_MOON_FACES;
      let current = rd[p].value || 0;
      current = (current + 1) % faces.length;
      rd[p].value = current;
      S.battle.rounds = [...S.battle.rounds];
      const el = document.getElementById('ft-bm-' + player);
      if (el) el.value = current;
      const desc = document.getElementById('ft-bm-desc-' + player);
      if (desc) desc.textContent = CONFIG.BAD_MOON_DESCS[current] || '';
      saveDraftDebounced();
    },

    setFTTide: function(player, track, step) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { track: null, step: 0 };
      if (typeof rd[p] !== 'object' || rd[p] === null) rd[p] = { track: null, step: 0 };
      const state = S.battle.tideState[player];
      const currentTrack = state.track;
      const currentStep = state.step;
      let valid = false;
      if (currentTrack === null) { if (step === 1) valid = true; }
      else if (currentTrack === track) { if (step === currentStep + 1) valid = true; if (step === 1 && currentStep > 1) valid = true; }
      else { if (step === 1) valid = true; }
      if (!valid) { toast('Invalid tide selection.', true); return; }
      state.track = track; state.step = step;
      rd[p].track = track; rd[p].step = step;
      S.battle.rounds = [...S.battle.rounds];
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    clearFTTide: function(player) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { track: null, step: 0 };
      rd[p].track = null; rd[p].step = 0;
      S.battle.tideState[player] = { ...S.battle._prevTideState[player] };
      S.battle.rounds = [...S.battle.rounds];
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    adjKhornePoints: function(player, delta) {
      const state = S.battle.khorne[player];
      state.points = Math.max(0, state.points + delta);
      saveDraftDebounced();
      render(true);
    },

    unlockKhorneAbility: function(player, abilityId) {
      const state = S.battle.khorne[player];
      const ability = KHORNE_TREE[abilityId];
      if (!ability) return;
      if (state.unlocked.includes(abilityId)) { toast('Already unlocked.', true); return; }
      const hasParent = ability.parents.length === 0 || ability.parents.some(p => state.unlocked.includes(p));
      if (!hasParent) { toast('Prerequisite not met.', true); return; }
      if (state.points < ability.cost) { toast('Not enough Blood Tithe Points.', true); return; }
      state.points -= ability.cost;
      state.unlocked.push(abilityId);
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    pickLuminethRune: function(player, runeKey) {
      const rd = S.battle.rounds[S.battle.currentRound];
      const key = player === 'p1' ? 'p1ft' : 'p2ft';
      const active = rd[key] && rd[key].active ? rd[key].active : null;
      const isRound1 = S.battle.currentRound === 0;
      const state = S.battle.lumineth[player];
      const extraRune = state.extraRune || false;
      const extraUsed = state.extraUsed || false;
      const allowSecond = isRound1 && extraRune && !extraUsed && active !== null;
      if (active !== null && !allowSecond) { toast('Already picked a rune this round.', true); return; }
      if (extraUsed && isRound1) { toast('Extra rune already used.', true); return; }
      state.scripture[runeKey] = (state.scripture[runeKey] || 0) + 1;
      if (!rd[key]) rd[key] = { active: runeKey };
      else rd[key].active = runeKey;
      if (allowSecond) state.extraUsed = true;
      S.battle.rounds = [...S.battle.rounds];
      saveDraftDebounced();
      renderPreservingScroll(true);
    },

    toggleDOKBlessing: function(player, blessingKey) {
      const p = player === 'p1' ? 'p1ft' : 'p2ft';
      const rd = S.battle.rounds[S.battle.currentRound];
      if (!rd[p]) rd[p] = { activeBlessings: [], addedThisRound: [] };
      const active = rd[p].activeBlessings || [];
      const added = rd[p].addedThisRound || [];
      const idx = active.indexOf(blessingKey);
      if (idx > -1) {
        if (added.includes(blessingKey)) {
          active.splice(idx, 1);
          const addedIdx = added.indexOf(blessingKey);
          if (addedIdx > -1) added.splice(addedIdx, 1);
          rd[p].activeBlessings = active;
          rd[p].addedThisRound = added;
          S.battle.rounds = [...S.battle.rounds];
          saveDraftDebounced();
          renderPreservingScroll(true);
          toast('Blessing ejected.');
        } else {
          toast('This blessing was selected in a previous round and cannot be removed.', true);
        }
      } else {
        if (added.length > 0) {
          toast('You can only add one blessing per round.', true);
          return;
        }
        active.push(blessingKey);
        added.push(blessingKey);
        rd[p].activeBlessings = active;
        rd[p].addedThisRound = added;
        S.battle.rounds = [...S.battle.rounds];
        saveDraftDebounced();
        renderPreservingScroll(true);
        toast('Blessing selected.');
      }
    },

    exportData: function(type) {
      let data = {};
      const timestamp = new Date().toISOString().slice(0,10);
      let filename = '';
      if (type === 'profiles') {
        const users = DataCache.users;
        const exportUsers = {};
        for (const un in users) {
          const u = users[un];
          const { isAdmin, isSuspended, ...safe } = u;
          exportUsers[un] = safe;
        }
        data = { exportedAt: new Date().toISOString(), type: 'user_profiles', users: exportUsers };
        filename = 'aos_profiles_' + timestamp + '.json';
      } else if (type === 'games_all') {
        const games = DataCache.games;
        data = { exportedAt: new Date().toISOString(), type: 'all_games', games };
        filename = 'aos_all_games_' + timestamp + '.json';
      } else if (type === 'games_user') {
        const username = S.admin.exportUser;
        if (!username || username === 'all') { toast('Please select a specific user.', true); return; }
        const games = DataCache.games.filter(g => g.player1 === username || g.player2 === username);
        data = { exportedAt: new Date().toISOString(), type: 'user_games', username, games };
        filename = 'aos_games_' + username + '_' + timestamp + '.json';
      } else { toast('Unknown export type.', true); return; }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Exported ' + filename);
    }
  };
  // ─── PART 2 ──────  // ─── DRAFT MIGRATION ──────────────────────────────────────────────
  function migrateDraft(draft) {
    if (draft.khorne && !draft.khorne.p1) {
      const old = draft.khorne;
      draft.khorne = { p1: { ...old }, p2: { ...old } };
    }
    if (draft.luminethScripture && !draft.lumineth?.p1) {
      const scripture = draft.luminethScripture || { strength:0, river:0, wind:0, mountain:0 };
      const extraRune = draft.luminethExtraRune || false;
      const extraUsed = draft.luminethExtraUsed || false;
      const st = { scripture: { ...scripture }, extraRune, extraUsed };
      draft.lumineth = { p1: { ...st }, p2: { ...st } };
      delete draft.luminethScripture;
      delete draft.luminethExtraRune;
      delete draft.luminethExtraUsed;
    }
    if (draft.tideState && !draft.tideState.p1) {
      const old = draft.tideState;
      const oldPrev = draft._prevTideState || { track: null, step: 0 };
      draft.tideState = { p1: { ...old }, p2: { ...old } };
      draft._prevTideState = { p1: { ...oldPrev }, p2: { ...oldPrev } };
    }
    return draft;
  }

  function clearDraft() { if (S.auth.session) deleteDraft(S.auth.session.username); }

  // Renamed from saveDraft to avoid conflict with the async Supabase version
  function saveBattleDraft() {
    if (!S.auth.session) return;
    const b = S.battle;
    if (b.step === 0 && !b.opponent && !b.faction1) { clearDraft(); return; }
    const draft = {
      step: b.step,
      opponentUsername: b.opponent ? b.opponent.username : null,
      opponentDisplayName: b.opponent ? b.opponent.displayName : null,
      opponentFactions: b.opponent ? b.opponent.factions : [],
      faction1: b.faction1,
      faction2: b.faction2,
      scenario: b.scenario,
      rounds: b.rounds,
      currentRound: b.currentRound,
      winner: b.winner,
      notes: b.notes,
      p1Tactics: b.p1Tactics,
      p2Tactics: b.p2Tactics,
      tacticProgress: b.tacticProgress,
      resources: { ...b.resources },
      underdog: b.underdog,
      doubleTurn: b.doubleTurn,
      manualUnderdog: b.manualUnderdog,
      useFactionTrackers: b.useFactionTrackers,
      isTTS: b.isTTS,
      isTournament: b.isTournament || false,
      khorne: b.khorne ? { p1: { ...b.khorne.p1 }, p2: { ...b.khorne.p2 } } : null,
      lumineth: b.lumineth ? { p1: { ...b.lumineth.p1 }, p2: { ...b.lumineth.p2 } } : null,
      tideState: b.tideState ? { p1: { ...b.tideState.p1 }, p2: { ...b.tideState.p2 } } : null,
      _prevTideState: b._prevTideState ? { p1: { ...b._prevTideState.p1 }, p2: { ...b._prevTideState.p2 } } : null
    };
    // Call the async Supabase version (which is still named saveDraft)
    saveDraft(S.auth.session.username, draft);
  }
  const saveDraftDebounced = debounce(saveBattleDraft, 1000);

  function debounce(fn, delay) {
    let t;
    return function(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  function renderTacticSelect(player, slot, isManual) {
    const arr = isManual ? (player === 'p1' ? S.landing.manualP1Tactics : S.landing.manualP2Tactics) : (player === 'p1' ? S.battle.p1Tactics : S.battle.p2Tactics);
    const cv = arr[slot] !== undefined ? arr[slot] : -1;
    const otherSlot = slot === 0 ? 1 : 0;
    const otherVal = arr[otherSlot] !== undefined ? arr[otherSlot] : -1;
    const action = isManual ? 'setManualTactic(\'' + player + '\', ' + slot + ', this.value)' : 'setTactic(\'' + player + '\', ' + slot + ', this.value)';
    let opts = '<option value="-1">-- Select Tactic ' + (slot+1) + ' --</option>';
    CONFIG.BATTLE_TACTICS.forEach((t, i) => {
      const dis = i === otherVal && otherVal >= 0;
      opts += '<option value="' + i + '" ' + (cv === i ? 'selected' : '') + (dis ? ' disabled' : '') + '>' + esc(t.name) + (dis ? ' (slot ' + (otherSlot+1) + ')' : '') + '</option>';
    });
    return '<select class="tac-select" onchange="Actions.' + action + '">' + opts + '</select>';
  }

  function renderTacticDisplay(player) {
    const tactics = player === 'p1' ? S.battle.p1Tactics : S.battle.p2Tactics;
    const rk = S.battle.currentRound;
    const progress = TacticManager.getCurrentProgress(player, rk);
    const blockedByDouble = S.battle.doubleTurn === player;
    if (!tactics.length) return '<div style="font-size:11px;color:var(--dim);padding:8px 0">No tactics</div>';
    let html = '<div class="tactic-section"><div class="tactic-header-row">Battle Tactics' + (blockedByDouble ? ' (BLOCKED - Double Turn)' : '') + ' (1 per tactic per turn)</div><div class="tactic-container">';
    const tacticIndices = tactics.filter(ti => ti >= 0);
    while (tacticIndices.length < 2) tacticIndices.push(-1);
    tacticIndices.forEach((ti, idx) => {
      html += '<div class="tactic-card">';
      if (ti < 0) { html += '<div class="tac-name" style="color:var(--dim);font-style:italic">— Tactic ' + (idx+1) + ' —</div>'; }
      else {
        const t = CONFIG.BATTLE_TACTICS[ti];
        if (!t) { html += '<div class="tac-name" style="color:var(--dim)">Unknown</div>'; return; }
        const completed = progress[ti] !== undefined ? progress[ti] : -1;
        const thisTacticUsed = TacticManager.hasNewSubThisRound(player, ti, rk);
        html += '<div class="tac-name">' + esc(t.name) + (thisTacticUsed ? ' ✓' : '') + '</div>';
        t.subs.forEach((sub, si) => {
          let cls = 'tac-sub';
          let onclick = '';
          if (blockedByDouble) cls += ' locked';
          else if (TacticManager.canDeselectSub(player, ti, si, rk)) { cls += ' done'; onclick = 'onclick="Actions.toggleTacticSub(\'' + player + '\',' + ti + ',' + si + ')"'; }
          else if (si <= completed) cls += ' done';
          else if (TacticManager.canSelectSub(player, ti, si, rk)) { cls += ' current'; onclick = 'onclick="Actions.toggleTacticSub(\'' + player + '\',' + ti + ',' + si + ')"'; }
          else cls += ' locked';
          html += '<div class="' + cls + '" ' + onclick + '><span class="tac-dot-sm"></span><span>' + esc(sub) + '</span>' + (si <= completed ? '<span class="tac-plus-sm">+5</span>' : '') + '</div>';
        });
      }
      html += '</div>';
    });
    html += '</div></div>';
    return html;
  }
